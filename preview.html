<title>ナナメの部屋 画面プレビュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --shell:#12211F; --shell-2:#1B302C; --shell-line:#2B453F;
  --shell-ink:#EAF2F0; --shell-muted:#93AAA4; --shell-faint:#6B837D;
  --accent:#4DD3BB; --accent-ink:#0A3C34; --amber:#F6C445;
  --stage:#0B1817;
}
:root:not([data-theme="dark"]){
  --shell:#F2F5F4; --shell-2:#FFFFFF; --shell-line:#DDE5E3;
  --shell-ink:#12211F; --shell-muted:#5B6670; --shell-faint:#8A939C;
  --accent:#0F8472; --accent-ink:#FFFFFF; --stage:#E6ECEA;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --shell:#12211F; --shell-2:#1B302C; --shell-line:#2B453F;
    --shell-ink:#EAF2F0; --shell-muted:#93AAA4; --shell-faint:#6B837D;
    --accent:#4DD3BB; --accent-ink:#0A3C34; --stage:#0B1817;
  }
}
:root[data-theme="dark"]{
  --shell:#12211F; --shell-2:#1B302C; --shell-line:#2B453F;
  --shell-ink:#EAF2F0; --shell-muted:#93AAA4; --shell-faint:#6B837D;
  --accent:#4DD3BB; --accent-ink:#0A3C34; --stage:#0B1817;
}
*{box-sizing:border-box}
body{margin:0;background:var(--shell);color:var(--shell-ink);
  font:400 14px/1.7 "Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  letter-spacing:.02em}
.pv{display:grid;grid-template-columns:284px minmax(0,1fr);min-height:100vh}
.pv-side{border-right:1px solid var(--shell-line);background:var(--shell-2);
  padding:26px 20px 40px;display:flex;flex-direction:column;gap:22px}
.pv-brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;letter-spacing:.04em}
.pv-mark{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);font-size:13px}
.pv-sub{margin:0;color:var(--shell-muted);font-size:12px;line-height:1.85}
.pv-sub b{color:var(--shell-ink)}
.pv-groups{display:flex;flex-direction:column;gap:18px}
.pv-group h2{margin:0 0 7px;font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--shell-faint)}
.pv-nav{display:flex;flex-direction:column;gap:2px}
.pv-btn{display:block;width:100%;text-align:left;padding:9px 12px;border:0;border-radius:8px;cursor:pointer;
  background:transparent;color:var(--shell-ink);font:400 13px/1.5 inherit;letter-spacing:.02em}
.pv-btn:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.pv-btn[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.pv-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pv-foot{margin-top:auto;color:var(--shell-faint);font-size:11px;line-height:1.9}
.pv-main{display:flex;flex-direction:column;min-width:0;background:var(--stage)}
.pv-bar{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;padding:22px 28px 0}
.pv-title{margin:0;font-size:19px;font-weight:800;letter-spacing:.02em;text-wrap:balance}
.pv-file{color:var(--shell-faint);font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.pv-widths{margin-left:auto;display:flex;gap:3px;padding:3px;border-radius:999px;
  background:color-mix(in srgb,var(--shell-ink) 8%,transparent)}
.pv-w{padding:6px 13px;border:0;border-radius:999px;cursor:pointer;background:transparent;
  color:var(--shell-muted);font:700 11px inherit}
.pv-w[aria-pressed="true"]{background:var(--shell-2);color:var(--shell-ink)}
.pv-note{margin:8px 28px 0;padding:11px 15px;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
  background:color-mix(in srgb,var(--accent) 12%,transparent);font-size:13px;line-height:1.8;max-width:74ch}
.pv-stage{flex:1;display:grid;place-items:start center;padding:20px 28px 34px;overflow:auto}
.pv-frame{width:100%;max-width:1180px;height:min(78vh,880px);border:1px solid var(--shell-line);
  border-radius:12px;background:#fff;box-shadow:0 18px 44px rgba(0,0,0,.18);transition:max-width .18s}
.pv-frame.is-mobile{max-width:400px}
iframe{width:100%;height:100%;border:0;border-radius:12px;display:block}
@media (max-width:900px){
  .pv{grid-template-columns:1fr}
  .pv-side{border-right:0;border-bottom:1px solid var(--shell-line)}
  .pv-frame{height:70vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="pv">
  <aside class="pv-side">
    <div class="pv-brand"><span class="pv-mark">✦</span> ナナメの部屋</div>
    <p class="pv-sub">
      エスラボの対話プログラムの画面プレビューです。<b>データはすべて見本</b>で、
      実在の生徒・ボランティアのものではありません。左から画面を選んでください。
    </p>
    <div class="pv-groups" id="pv-groups"></div>
    <p class="pv-foot">
      シナリオ1（空き枠の登録 → 予約 → 対話 → 議事録が事務局へ）の全画面。<br />
      本物のHTML／CSS／JSをそのまま表示しています。
    </p>
  </aside>

  <main class="pv-main">
    <div class="pv-bar">
      <h1 class="pv-title" id="pv-title"></h1>
      <span class="pv-file" id="pv-file"></span>
      <div class="pv-widths">
        <button type="button" class="pv-w" data-w="pc" aria-pressed="true">PC</button>
        <button type="button" class="pv-w" data-w="sp" aria-pressed="false">スマホ</button>
      </div>
    </div>
    <p class="pv-note" id="pv-note"></p>
    <div class="pv-stage">
      <div class="pv-frame" id="pv-frame"><iframe id="pv-iframe" title="画面プレビュー"></iframe></div>
    </div>
  </main>
</div>

<script>
const SCREENS = [{"id":"portal","group":"入り口","label":"エスラボ ポータル","note":"2本柱。ジャーナル（学校・先生）とナナメの部屋（エスラボ）は、ここから別々に入る。","page":"portal.html","q":"","bodyClass":"portal-page","inner":"\n    <main class=\"portal-shell\">\n      <header class=\"portal-head\">\n        <div class=\"portal-brand\"><span class=\"brand-mark\">✦</span><span>エスラボ</span></div>\n        <p class=\"eyebrow\">ESLAB PORTAL</p>\n        <h1 class=\"portal-title\">エスラボ ポータル</h1>\n        <p class=\"portal-lead\">エスラボのツールの入り口です。使うものを選んでください。</p>\n      </header>\n\n      <section class=\"portal-section\" aria-labelledby=\"portal-now-title\">\n        <h2 class=\"portal-section-title\" id=\"portal-now-title\">いま使えるもの</h2>\n        <div class=\"portal-grid\">\n          <a class=\"portal-tile\" href=\"./login.html\">\n            <span class=\"portal-ico\">📓</span>\n            <b class=\"portal-name\">探究ジャーナル（生徒）</b>\n            <span class=\"portal-desc\">学年・組・番号でひらいて、探究の記録を書く。</span>\n            <span class=\"portal-arrow\">→</span>\n          </a>\n          <a class=\"portal-tile\" href=\"./teacher.html\">\n            <span class=\"portal-ico\">🧑‍🏫</span>\n            <b class=\"portal-name\">探究ジャーナル（先生）</b>\n            <span class=\"portal-desc\">授業の設計・ダッシュボード・コメント記入・AI分析。</span>\n            <span class=\"portal-arrow\">→</span>\n          </a>\n          <a class=\"portal-tile\" href=\"./nanameya.html\">\n            <span class=\"portal-ico\">🛋️</span>\n            <b class=\"portal-name\">ナナメの部屋（生徒）</b>\n            <span class=\"portal-desc\">評価しない地域の大人と、問いの続きを1対1で話す。</span>\n            <span class=\"portal-arrow\">→</span>\n          </a>\n          <a class=\"portal-tile\" href=\"./nanameya-volunteer.html\">\n            <span class=\"portal-ico\">🤝</span>\n            <b class=\"portal-name\">ナナメの部屋（大人）</b>\n            <span class=\"portal-desc\">空いている時間を出す。探究カードを読む。議事録を残す。</span>\n            <span class=\"portal-arrow\">→</span>\n          </a>\n          <a class=\"portal-tile\" href=\"./nanameya-admin.html\">\n            <span class=\"portal-ico\">🛡️</span>\n            <b class=\"portal-name\">ナナメの部屋（事務局）</b>\n            <span class=\"portal-desc\">議事録の受信箱・予約一覧・通報対応。</span>\n            <span class=\"portal-arrow\">→</span>\n          </a>\n        </div>\n      </section>\n\n      <section class=\"portal-section\" aria-labelledby=\"portal-soon-title\">\n        <h2 class=\"portal-section-title\" id=\"portal-soon-title\">準備中</h2>\n        <!-- ▼ 公開するときは <div class=\"portal-tile is-soon\"> を\n             <a class=\"portal-tile\" href=\"./◯◯.html\"> に変え、\n             .portal-badge を .portal-arrow（→）に差し替えてください。 -->\n        <div class=\"portal-grid\">\n          <div class=\"portal-tile is-soon\">\n            <span class=\"portal-ico\">🏫</span>\n            <b class=\"portal-name\">学校ごとの管理</b>\n            <span class=\"portal-desc\">複数校の登録・切り替え、学校ごとのジャーナル管理。</span>\n            <span class=\"portal-badge\">準備中</span>\n          </div>\n          <div class=\"portal-tile is-soon\">\n            <span class=\"portal-ico\">📝</span>\n            <b class=\"portal-name\">ナナメの大人になる</b>\n            <span class=\"portal-desc\">募集・応募・審査・研修（C5の導線）。</span>\n            <span class=\"portal-badge\">準備中</span>\n          </div>\n        </div>\n      </section>\n\n      <footer class=\"portal-foot\">エスラボ</footer>\n    </main>\n  ","script":""},{"id":"login","group":"入り口","label":"ジャーナル（参考）","note":"学校・先生の管轄。ナナメの部屋への導線は置かず、ポータルへ戻るリンクだけ。","page":"login.html","q":"","bodyClass":"login-page","inner":"\n    <main class=\"login-shell\">\n      <a class=\"portal-back\" id=\"portal-back\" href=\"./portal.html\"><span aria-hidden=\"true\">←</span> エスラボ ポータルへ戻る</a>\n      <div class=\"login-brand\"><span class=\"brand-mark\">✦</span><span>My 探究ジャーナル</span></div>\n      <section class=\"login-card\" aria-labelledby=\"login-title\">\n        <p class=\"eyebrow\">STUDENT LOGIN</p>\n        <h1 id=\"login-title\">自分のジャーナルをひらく</h1>\n        <p class=\"login-lead\">学年・組を選び、番号を入れてください。</p>\n        <form id=\"student-login\">\n          <div class=\"login-fields\">\n            <label>学年\n              <select id=\"grade\" required>\n                <option value=\"\" disabled selected>―</option>\n                <option value=\"1\">1</option>\n                <option value=\"2\">2</option>\n                <option value=\"3\">3</option>\n              </select>\n            </label>\n            <label>組\n              <select id=\"class\" required disabled>\n                <option value=\"\" disabled selected>―</option>\n              </select>\n            </label>\n            <label>番号\n              <input id=\"number\" inputmode=\"numeric\" maxlength=\"2\" placeholder=\"12\" required />\n            </label>\n          </div>\n          <p class=\"login-message\" id=\"login-message\" aria-live=\"polite\"></p>\n          <button class=\"primary login-submit\" type=\"submit\">ジャーナルをひらく</button>\n        </form>\n      </section>\n      <a class=\"teacher-login\" href=\"./teacher.html\">先生用ログイン <span>→</span></a>\n    </main>\n    \n    \n    \n    \n  ","script":"/**\n * セッション定義（A〜D）と、質問→スプレッドシート列（1始まり）の対応。\n * 生徒ページ・先生ページの両方がこの定義を使ってフォームを組み立てます。\n * col は Apps Script 側の列番号（A=1 … N=14）と一致させること。\n *\n * type 1 = My探究①型（セッション A / B）\n * type 3 = My探究③型（セッション C / D＝サイクル計画）\n */\nwindow.JOURNAL_SCHEMA = {\n  order: ['A', 'B', 'C', 'D'],\n\n  sessions: {\n    A: {\n      type: 1,\n      eyebrow: 'SESSION A　6月26日',\n      title: 'Ａ　「好き」を、探究の問いへ',\n      intro: 'いきなり立派なテーマを決めなくて大丈夫。<br /><strong>好きなこと → 気になること → こうかもしれない</strong>を、順番に置いてみよう。'\n    },\n    B: {\n      type: 1,\n      eyebrow: 'SESSION B　6月29日',\n      title: 'Ｂ　問いを、探究の形へ',\n      intro: '前回の言葉を見返しながら、いまの探究の言葉に更新しよう。変わっても、変わらなくても大丈夫。'\n    },\n    C: {\n      type: 3,\n      eyebrow: 'SESSION C　7月3日',\n      title: 'Ｃ　計画を、最初の行動へ',\n      intro: 'サイクル活動Ⅰに向けて、目標と方法を「実際に動けるくらい」具体的にしよう。'\n    },\n    D: {\n      type: 3,\n      eyebrow: 'SESSION D　7月14日',\n      title: 'Ｄ　計画を、最初の行動へ',\n      intro: 'サイクル活動Ⅰに向けた計画の仕上げ。場所と最初の一歩まで決めておこう。'\n    }\n  },\n\n  // 質問セット（type ごと）。col = スプレッドシートの列番号（1始まり）。\n  fields: {\n    1: [\n      { step: 'STEP 1　いま心にあること', note: '正解はありません。書けるところから、短くても大丈夫。' },\n      { col: 5,  n: '01', label: '初めのつぶやき', help: 'いま好きなこと、気になっていることを、そのまま書こう。', required: true, long: true },\n      { col: 6,  n: '02', label: '問いの芽生え', help: '「なんで？」と思ったことを、問いの形にしてみよう。', required: true, long: true },\n      { col: 7,  n: '03', label: '一歩深まった問い', help: '「もしかして…」をつけて、今の仮説を書いてみよう。', required: true, long: true , full: true },\n      { step: 'STEP 2　探究の輪郭をつくる', note: 'まだ変わって大丈夫。今の時点で、進みたい方向を置いておこう。' },\n      { col: 8,  n: '04', label: '何をどこまで明らかにしたい？【目的】', help: '', required: true, long: true },\n      { col: 9,  n: '05', label: 'そのために、どんな調査・分析をする？【目標】', help: '', required: true, long: true },\n      { col: 10, n: '06', label: '関係しそうな領域は？', help: '教科名でも、気になる分野でもOK。', required: false, long: false , full: true },\n      { step: 'STEP 3　次へつなげる', note: '探究は、今日の答えで終わりません。次の一歩の種を残そう。' },\n      { col: 11, n: '07', label: 'この探究が進むと、何が起きそう？', help: '', required: false, long: true },\n      { col: 12, n: '08', label: '他者の意見から、参考にしたいことは？', help: '', required: false, long: true },\n      { col: 13, n: '09', label: '今の私の探究テーマ', help: '最後に、今の問いを短いテーマにしてみよう。あとから何度変えても大丈夫。', required: true, long: true , full: true }\n    ],\n    3: [\n      { step: 'STEP 1　目標を更新する', note: '今のテーマと目標を確認しよう。' },\n      { col: 5,  n: '01', label: '今の探究テーマ', help: 'My探究を通して調べたい・分析したいこと。', required: true, long: true },\n      { col: 7,  n: '02', label: '更新した目標', help: '', required: true, long: true },\n      { col: 8,  n: '03', label: '目的・目標に迫るために研究すること', help: '', required: true, long: true , full: true },\n      { step: 'STEP 2　方法を具体化する', note: '実際に動けるくらい、計画を具体的にしよう。' },\n      { col: 9,  n: '04', label: 'どんな方法で確かめる？', help: '課題を解決するための具体的なやり方。', required: true, long: true },\n      { col: 10, n: '05', label: '事前に準備しておくことは？', help: '持ち込みや、申請しておきたいものなど。', required: false, long: true },\n      { col: 11, n: '06', label: '関係する領域は？', help: '教科名等。', required: false, long: false , full: true },\n      { step: 'STEP 3　動き出す準備をする', note: '場所と最初の一歩を決めよう。' },\n      { col: 12, n: '07', label: '次回の活動場所は？（ラボ）', help: '', required: false, long: false , full: true },\n      { col: 13, n: '08', label: 'サイクルⅠに向けてメモしておきたいことは？', help: '', required: false, long: true , full: true }\n    ]\n  }\n};\n\n;\n/**\n * API クライアント（Cloudflare Pages Functions + D1 / デモフォールバック共用）\n * window.JournalAPI として公開。\n *   JournalAPI.isLive()                    … 実バックエンド接続か（DEMO=false）\n *   JournalAPI.readStudent({grade,cls,no}) … 生徒1名分の全セッション\n *   JournalAPI.saveAnswers({...})          … 回答を保存\n *   JournalAPI.saveComment({...})          … 先生コメントを保存\n */\n(function () {\n  var cfg = window.JOURNAL_CONFIG || {};\n  var BASE = (cfg.API_BASE || '/api').replace(/\\/$/, '');\n  var DEMO = !!cfg.DEMO;\n\n  function isLive() { return !DEMO; }\n\n  // ---- デモデータ（DEMO=true 時）----\n  var DEMO_DATA = {\n    student: { grade: '9', cls: 'A', no: '47', name: '原宿 外苑' },\n    sessions: {\n      A: { 5: 'Mrs.GREEN APPLEの曲が好き！', 6: 'なぜミセスの曲はみんなに人気なんだろう？', 7: '使われている歌詞の言葉が心に響くのかもしれない', 8: '本探究では、ミセスの曲の魅力を明らかにする。', 9: 'みんなが好きなミセスの歌詞を調査する。', 10: '音楽、国語、社会', 11: '人気曲の共通点がわかり、流行に敏感になるかも', 12: '調査方法についていろいろな方法を知りたい', 13: '流行の曲はどうして流行っているのか', 14: '人間が好む特定のリズムがあるのではないか？音楽で実験してみてはどうか（◎◎）' },\n      B: { 5: 'Mrs.GREEN APPLEの曲が好き！', 6: 'なぜミセスの曲はみんなに人気なんだろう？', 7: '使われている歌詞の言葉が心に響くのかもしれない', 8: '本探究では、ミセスの曲の魅力を明らかにする。', 9: 'みんなが好きなミセスの歌詞を調査する。', 10: '音楽、国語、社会', 11: '人気曲の共通点がわかり、流行に敏感になるかも', 12: '調査方法についていろいろな方法を知りたい', 13: '流行の曲はどうして流行っているのか', 14: '人間が好む特定のリズムがあるのではないか？音楽で実験してみてはどうか（◎◎）' },\n      C: { 5: '℃流行の曲予測', 7: '心に響く歌詞・フレーズを調査しランキング形式にする', 8: '「心に響く歌詞・フレーズ」とは何か明確にする', 9: '「好きな歌とその歌詞」について50人くらいに聞く。また、ネットで情報収集する。', 10: 'アンケートをFormで集めたい。ラボの先生に許可をもらっておく。', 11: '音楽、国語、社会、数学', 12: '音楽室', 13: 'Form作成、許可をもらう、Excelの使い方', 14: '人間が好む特定のリズムがあるのではないか？音楽で実験してみてはどうか（◎◎）' },\n      D: { 5: '℃流行の曲予測', 7: '心に響く歌詞・フレーズを調査しランキング形式にする', 8: '「心に響く歌詞・フレーズ」とは何か明確にする', 9: '「好きな歌とその歌詞」について50人くらいに聞く。また、ネットで情報収集する。', 10: 'アンケートをFormで集めたい。ラボの先生に許可をもらっておく。', 11: '音楽、国語、社会、数学', 12: '音楽室', 13: 'Form作成、許可をもらう、Excelの使い方', 14: '人間が好む特定のリズムがあるのではないか？音楽で実験してみてはどうか（◎◎）' }\n    }\n  };\n\n  function demoRead(key) {\n    var match = (String(key.grade) === '9' && String(key.cls).toUpperCase() === 'A' && String(key.no) === '47');\n    var order = (window.JOURNAL_SCHEMA && window.JOURNAL_SCHEMA.order) || ['A', 'B', 'C', 'D'];\n    var sessions = order.map(function (sid) {\n      var cells = (match && DEMO_DATA.sessions[sid]) ? DEMO_DATA.sessions[sid] : {};\n      return { id: sid, found: match, cells: cells, teacherComment: cells[14] || '' };\n    });\n    return Promise.resolve({ ok: true, demo: true, student: match ? DEMO_DATA.student : { grade: key.grade, cls: key.cls, no: key.no, name: '' }, sessions: sessions });\n  }\n\n  function readStudent(key) {\n    if (DEMO) return demoRead(key);\n    var url = BASE + '/read?grade=' + encodeURIComponent(key.grade) +\n      '&cls=' + encodeURIComponent(key.cls) + '&no=' + encodeURIComponent(key.no);\n    return fetch(url, { method: 'GET', headers: { 'accept': 'application/json' } })\n      .then(function (r) { return r.json(); });\n  }\n\n  function post(payload) {\n    if (DEMO) return Promise.resolve({ ok: true, demo: true });\n    return fetch(BASE + '/save', {\n      method: 'POST',\n      headers: { 'content-type': 'application/json' },\n      body: JSON.stringify(payload)\n    }).then(function (r) { return r.json(); });\n  }\n\n  function saveAnswers(o) {\n    return post({ action: 'saveAnswers', grade: o.grade, cls: o.cls, no: o.no, name: o.name || '', sessionId: o.sessionId, answers: o.answers });\n  }\n  function saveComment(o) {\n    return post({ action: 'saveComment', grade: o.grade, cls: o.cls, no: o.no, sessionId: o.sessionId, comment: o.comment });\n  }\n\n  // クラス全員（同学年・同クラス・指定セッション）の一覧\n  function listClass(o) {\n    if (DEMO) {\n      var d = DEMO_DATA.sessions[o.session] || {};\n      var row = { grade: '9', cls: 'A', no: '47', name: DEMO_DATA.student.name };\n      Object.keys(d).forEach(function (k) { row['col' + k] = d[k]; });\n      return Promise.resolve({ ok: true, rows: [row] });\n    }\n    var url = BASE + '/list?grade=' + encodeURIComponent(o.grade) + '&cls=' + encodeURIComponent(o.cls) +\n      (o.session ? '&session=' + encodeURIComponent(o.session) : '');   // session 省略でクラス全件\n    return fetch(url, { method: 'GET', headers: { 'accept': 'application/json' } }).then(function (r) { return r.json(); });\n  }\n\n  window.JournalAPI = { isLive: isLive, readStudent: readStudent, saveAnswers: saveAnswers, saveComment: saveComment, listClass: listClass };\n})();\n\n;\n// 「エスラボ ポータルへ戻る」の行き先（config.js の PORTAL_URL で差し替え可能）\nconst portalBack = document.querySelector('#portal-back');\nif (portalBack && window.JOURNAL_CONFIG && window.JOURNAL_CONFIG.PORTAL_URL) {\n  portalBack.href = window.JOURNAL_CONFIG.PORTAL_URL;\n}\n\nconst loginForm = document.querySelector('#student-login');\nconst message = document.querySelector('#login-message');\nconst gradeSel = document.querySelector('#grade');\nconst classSel = document.querySelector('#class');\n\n// 組の選択肢：D組は1年のみ\nconst CLASSES = { '1': ['A', 'B', 'C', 'D'], '2': ['A', 'B', 'C'], '3': ['A', 'B', 'C'] };\n\nfunction fillClasses() {\n  const g = gradeSel.value;\n  const list = CLASSES[g] || [];\n  classSel.innerHTML = '<option value=\"\" disabled selected>―</option>' +\n    list.map((c) => `<option value=\"${c}\">${c}</option>`).join('');\n  classSel.disabled = !g;\n}\ngradeSel.addEventListener('change', fillClasses);\n\nloginForm.addEventListener('submit', (event) => {\n  event.preventDefault();\n  const grade = gradeSel.value.trim();\n  const className = classSel.value.trim().toUpperCase();\n  const number = document.querySelector('#number').value.trim();\n\n  if (!grade || !className || !number) {\n    message.textContent = '学年・組・番号をすべて選んでください。';\n    return;\n  }\n\n  sessionStorage.setItem('journal.student', JSON.stringify({ grade, cls: className, no: number }));\n  window.location.href = './student.html';\n});\n"},{"id":"list-locked","group":"生徒","label":"大人をえらぶ（同意まえ）","note":"保護者の同意が確認できるまで、予約ボタンそのものを出さない。","page":"nanameya.html","q":"consent=none","bodyClass":"naname-page","inner":"\n    <div class=\"app-shell\">\n      <header class=\"topbar\">\n        <a class=\"brand\" href=\"./portal.html\"><span class=\"brand-mark\">✦</span> ナナメの部屋</a>\n        <span class=\"topbar-role\">エスラボ</span>\n      </header>\n\n      <main class=\"naname-main\">\n        <p class=\"eyebrow\">NANAME NO HEYA</p>\n        <h1 class=\"naname-title\">問いの続きを、話してみる。</h1>\n        <p class=\"naname-lead\">\n          評価しない地域の大人と、1対1で15〜30分。<br />\n          あなたがジャーナルに書いた記録がそのまま話す材料になるので、準備はいりません。\n        </p>\n\n        <!-- S3: 保護者同意ゲート。同意が取れるまで予約導線を出さない -->\n        <section class=\"consent-gate\" id=\"consent-gate\" hidden>\n          <span class=\"consent-ico\">🏠</span>\n          <div>\n            <b class=\"consent-name\">まず、おうちの人の同意が必要です</b>\n            <p class=\"consent-desc\">\n              はじめて話す前に、保護者の方の同意をもらってください。同意が確認できると、予約ボタンが出ます。\n            </p>\n            <a class=\"consent-btn\" href=\"#\" id=\"consent-start\">おうちの人に見せる説明をひらく</a>\n          </div>\n        </section>\n\n        <!-- S2: 迫り方で選ぶ（「調べる」以外の入り口を先に見せる） -->\n        <section class=\"naname-section\" aria-labelledby=\"filter-title\">\n          <h2 class=\"naname-section-title\" id=\"filter-title\">どう迫ってみたい？</h2>\n          <p class=\"naname-section-note\">大人は「職業」ではなく「迫り方」で選びます。ピンとこなければ「ぜんぶ」でOK。</p>\n          <div class=\"approach-row\" id=\"approach-row\" role=\"group\" aria-label=\"迫り方でしぼる\"></div>\n        </section>\n\n        <section class=\"naname-section\" aria-labelledby=\"people-title\">\n          <h2 class=\"naname-section-title\" id=\"people-title\">ナナメの大人</h2>\n          <div class=\"people-grid\" id=\"people-grid\"></div>\n          <p class=\"people-empty\" id=\"people-empty\" hidden>この迫り方の大人は、いまはお休み中です。</p>\n        </section>\n\n        <p class=\"naname-foot-note\">\n          ここで話したことは成績には関係しません。連絡先の交換はできない決まりです。\n        </p>\n      </main>\n\n      <!-- S5: 通報導線は全画面に常設する -->\n      <a class=\"help-fab\" href=\"#\" id=\"help-fab\">困ったときは</a>\n    </div>\n\n    \n    \n    \n  ","script":"/**\n * ナナメの部屋トップ（S2 選ぶ / S3 同意ゲート）\n * モックデータ（nanameya-data.js）で描画する。API に差し替えるときは\n * loadData() の中だけを /api/nanameya/volunteers 等に置き換える。\n */\nconst DATA = window.NANAMEYA_DATA;\nconst params = new URLSearchParams(location.search);\n\n// 保護者同意の状態。モック確認用に ?consent=approved で切り替えられる\nconst consentStatus = params.get('consent') || DATA.consent.status;\nconst consentOK = consentStatus === 'approved';\n\nconst approachRow = document.querySelector('#approach-row');\nconst peopleGrid = document.querySelector('#people-grid');\nconst peopleEmpty = document.querySelector('#people-empty');\nlet current = 'all';\n\n/* ---- S3: 同意ゲート（未同意なら予約導線を出さない） ---- */\ndocument.querySelector('#consent-gate').hidden = consentOK;\n\n/* ---- 迫り方チップ ---- */\nfunction renderApproaches() {\n  const all = [{ key: 'all', label: 'ぜんぶ', ico: '✦' }, ...DATA.approaches];\n  approachRow.innerHTML = all.map((a) => `\n    <button type=\"button\" class=\"approach-chip${a.key === current ? ' selected' : ''}\"\n            data-key=\"${a.key}\" aria-pressed=\"${a.key === current}\">\n      <span class=\"approach-ico\" aria-hidden=\"true\">${a.ico}</span>${a.label}\n    </button>`).join('');\n}\n\napproachRow.addEventListener('click', (e) => {\n  const chip = e.target.closest('.approach-chip');\n  if (!chip) return;\n  current = chip.dataset.key;\n  renderApproaches();\n  renderPeople();\n});\n\n/* ---- ナナメの大人カード ---- */\nfunction approachLabel(key) {\n  const a = DATA.approaches.find((x) => x.key === key);\n  return a ? `${a.ico} ${a.label}` : '';\n}\n\nfunction renderPeople() {\n  const list = current === 'all'\n    ? DATA.volunteers\n    : DATA.volunteers.filter((v) => v.approach === current);\n\n  peopleEmpty.hidden = list.length > 0;\n  peopleGrid.innerHTML = list.map((v) => `\n    <article class=\"person-card\">\n      <div class=\"person-head\">\n        <span class=\"person-avatar\" aria-hidden=\"true\">${v.avatar}</span>\n        <div>\n          <b class=\"person-name\">${v.name}</b>\n          <span class=\"person-title\">${v.title}</span>\n        </div>\n        <span class=\"person-approach\">${approachLabel(v.approach)}</span>\n      </div>\n      <p class=\"person-voice\">「${v.voice}」</p>\n      <p class=\"person-intro\">${v.intro}</p>\n      <ul class=\"person-tags\">${v.interests.map((t) => `<li>${t}</li>`).join('')}</ul>\n      ${consentOK\n        ? `<a class=\"person-book\" href=\"./nanameya-book.html?v=${v.id}\">この人と話す <span aria-hidden=\"true\">→</span></a>`\n        : `<span class=\"person-locked\">おうちの人の同意が確認できると予約できます</span>`}\n    </article>`).join('');\n}\n\nrenderApproaches();\nrenderPeople();\n\n/* ---- S5: 困ったときは（実装時は /api/nanameya/report へ POST）---- */\ndocument.querySelector('#help-fab').addEventListener('click', (e) => {\n  e.preventDefault();\n  alert('（モック）エスラボ運営にすぐ知らせます。\\n実装時はこのボタンで運営へ即時通知が飛びます。');\n});\n\ndocument.querySelector('#consent-start').addEventListener('click', (e) => {\n  e.preventDefault();\n  alert('（モック）保護者向けの説明ページをひらきます。\\n同意の取得方法は学校との合意待ちのため、導線だけ用意しています。');\n});\n"},{"id":"list","group":"生徒","label":"大人をえらぶ（同意ずみ）","note":"職業ではなく「迫り方」で絞る。「調べる」56%偏重を崩すための入り口。","page":"nanameya.html","q":"consent=approved","bodyClass":"naname-page","inner":"\n    <div class=\"app-shell\">\n      <header class=\"topbar\">\n        <a class=\"brand\" href=\"./portal.html\"><span class=\"brand-mark\">✦</span> ナナメの部屋</a>\n        <span class=\"topbar-role\">エスラボ</span>\n      </header>\n\n      <main class=\"naname-main\">\n        <p class=\"eyebrow\">NANAME NO HEYA</p>\n        <h1 class=\"naname-title\">問いの続きを、話してみる。</h1>\n        <p class=\"naname-lead\">\n          評価しない地域の大人と、1対1で15〜30分。<br />\n          あなたがジャーナルに書いた記録がそのまま話す材料になるので、準備はいりません。\n        </p>\n\n        <!-- S3: 保護者同意ゲート。同意が取れるまで予約導線を出さない -->\n        <section class=\"consent-gate\" id=\"consent-gate\" hidden>\n          <span class=\"consent-ico\">🏠</span>\n          <div>\n            <b class=\"consent-name\">まず、おうちの人の同意が必要です</b>\n            <p class=\"consent-desc\">\n              はじめて話す前に、保護者の方の同意をもらってください。同意が確認できると、予約ボタンが出ます。\n            </p>\n            <a class=\"consent-btn\" href=\"#\" id=\"consent-start\">おうちの人に見せる説明をひらく</a>\n          </div>\n        </section>\n\n        <!-- S2: 迫り方で選ぶ（「調べる」以外の入り口を先に見せる） -->\n        <section class=\"naname-section\" aria-labelledby=\"filter-title\">\n          <h2 class=\"naname-section-title\" id=\"filter-title\">どう迫ってみたい？</h2>\n          <p class=\"naname-section-note\">大人は「職業」ではなく「迫り方」で選びます。ピンとこなければ「ぜんぶ」でOK。</p>\n          <div class=\"approach-row\" id=\"approach-row\" role=\"group\" aria-label=\"迫り方でしぼる\"></div>\n        </section>\n\n        <section class=\"naname-section\" aria-labelledby=\"people-title\">\n          <h2 class=\"naname-section-title\" id=\"people-title\">ナナメの大人</h2>\n          <div class=\"people-grid\" id=\"people-grid\"></div>\n          <p class=\"people-empty\" id=\"people-empty\" hidden>この迫り方の大人は、いまはお休み中です。</p>\n        </section>\n\n        <p class=\"naname-foot-note\">\n          ここで話したことは成績には関係しません。連絡先の交換はできない決まりです。\n        </p>\n      </main>\n\n      <!-- S5: 通報導線は全画面に常設する -->\n      <a class=\"help-fab\" href=\"#\" id=\"help-fab\">困ったときは</a>\n    </div>\n\n    \n    \n    \n  ","script":"/**\n * ナナメの部屋トップ（S2 選ぶ / S3 同意ゲート）\n * モックデータ（nanameya-data.js）で描画する。API に差し替えるときは\n * loadData() の中だけを /api/nanameya/volunteers 等に置き換える。\n */\nconst DATA = window.NANAMEYA_DATA;\nconst params = new URLSearchParams(location.search);\n\n// 保護者同意の状態。モック確認用に ?consent=approved で切り替えられる\nconst consentStatus = params.get('consent') || DATA.consent.status;\nconst consentOK = consentStatus === 'approved';\n\nconst approachRow = document.querySelector('#approach-row');\nconst peopleGrid = document.querySelector('#people-grid');\nconst peopleEmpty = document.querySelector('#people-empty');\nlet current = 'all';\n\n/* ---- S3: 同意ゲート（未同意なら予約導線を出さない） ---- */\ndocument.querySelector('#consent-gate').hidden = consentOK;\n\n/* ---- 迫り方チップ ---- */\nfunction renderApproaches() {\n  const all = [{ key: 'all', label: 'ぜんぶ', ico: '✦' }, ...DATA.approaches];\n  approachRow.innerHTML = all.map((a) => `\n    <button type=\"button\" class=\"approach-chip${a.key === current ? ' selected' : ''}\"\n            data-key=\"${a.key}\" aria-pressed=\"${a.key === current}\">\n      <span class=\"approach-ico\" aria-hidden=\"true\">${a.ico}</span>${a.label}\n    </button>`).join('');\n}\n\napproachRow.addEventListener('click', (e) => {\n  const chip = e.target.closest('.approach-chip');\n  if (!chip) return;\n  current = chip.dataset.key;\n  renderApproaches();\n  renderPeople();\n});\n\n/* ---- ナナメの大人カード ---- */\nfunction approachLabel(key) {\n  const a = DATA.approaches.find((x) => x.key === key);\n  return a ? `${a.ico} ${a.label}` : '';\n}\n\nfunction renderPeople() {\n  const list = current === 'all'\n    ? DATA.volunteers\n    : DATA.volunteers.filter((v) => v.approach === current);\n\n  peopleEmpty.hidden = list.length > 0;\n  peopleGrid.innerHTML = list.map((v) => `\n    <article class=\"person-card\">\n      <div class=\"person-head\">\n        <span class=\"person-avatar\" aria-hidden=\"true\">${v.avatar}</span>\n        <div>\n          <b class=\"person-name\">${v.name}</b>\n          <span class=\"person-title\">${v.title}</span>\n        </div>\n        <span class=\"person-approach\">${approachLabel(v.approach)}</span>\n      </div>\n      <p class=\"person-voice\">「${v.voice}」</p>\n      <p class=\"person-intro\">${v.intro}</p>\n      <ul class=\"person-tags\">${v.interests.map((t) => `<li>${t}</li>`).join('')}</ul>\n      ${consentOK\n        ? `<a class=\"person-book\" href=\"./nanameya-book.html?v=${v.id}\">この人と話す <span aria-hidden=\"true\">→</span></a>`\n        : `<span class=\"person-locked\">おうちの人の同意が確認できると予約できます</span>`}\n    </article>`).join('');\n}\n\nrenderApproaches();\nrenderPeople();\n\n/* ---- S5: 困ったときは（実装時は /api/nanameya/report へ POST）---- */\ndocument.querySelector('#help-fab').addEventListener('click', (e) => {\n  e.preventDefault();\n  alert('（モック）エスラボ運営にすぐ知らせます。\\n実装時はこのボタンで運営へ即時通知が飛びます。');\n});\n\ndocument.querySelector('#consent-start').addEventListener('click', (e) => {\n  e.preventDefault();\n  alert('（モック）保護者向けの説明ページをひらきます。\\n同意の取得方法は学校との合意待ちのため、導線だけ用意しています。');\n});\n"},{"id":"book","group":"生徒","label":"予約する","note":"STEP2が肝。相手に渡る探究カードを生徒が同じ画面で確認し、同意して初めて枠を選べる。","page":"nanameya-book.html","q":"v=v2&consent=approved","bodyClass":"naname-page","inner":"\n    <div class=\"app-shell\">\n      <header class=\"topbar\">\n        <a class=\"brand\" href=\"./nanameya.html\"><span class=\"brand-mark\">✦</span> ナナメの部屋</a>\n        <span class=\"topbar-role\">予約</span>\n      </header>\n\n      <main class=\"naname-main\">\n        <a class=\"portal-back\" href=\"./nanameya.html\"><span aria-hidden=\"true\">←</span> ほかの大人を見る</a>\n\n        <!-- 選んだ大人 -->\n        <section class=\"book-person\" id=\"book-person\"></section>\n\n        <!-- S3: 同意ゲート -->\n        <section class=\"consent-gate\" id=\"consent-gate\" hidden>\n          <span class=\"consent-ico\">🏠</span>\n          <div>\n            <b class=\"consent-name\">まず、おうちの人の同意が必要です</b>\n            <p class=\"consent-desc\">同意が確認できると、ここに空いている時間が出ます。</p>\n            <a class=\"consent-btn\" href=\"#\" id=\"consent-start\">おうちの人に見せる説明をひらく</a>\n          </div>\n        </section>\n\n        <div id=\"book-flow\" hidden>\n          <!-- STEP 1 何と呼ばれたいか -->\n          <section class=\"book-step\">\n            <h2 class=\"book-step-title\"><span>1</span>なんて呼ばれたい？</h2>\n            <p class=\"book-step-note\">本名じゃなくて大丈夫。この名前だけが相手に伝わります。</p>\n            <input class=\"book-nick\" id=\"book-nick\" maxlength=\"12\" placeholder=\"みなと\" value=\"みなと\" />\n          </section>\n\n          <!-- STEP 2 相手に渡るものを本人が確認する -->\n          <section class=\"book-step\">\n            <h2 class=\"book-step-title\"><span>2</span>相手に見えるのはこれだけ</h2>\n            <p class=\"book-step-note\">\n              あなたの記録から、この4つだけが相手に届きます。\n              学校名・組・出席番号・本名・先生のコメントは届きません。\n            </p>\n            <div class=\"book-preview\" id=\"book-preview\"></div>\n            <p class=\"book-mask-note\">\n              ●● は自動で伏せたところです。ほかにも見せたくないことが書いてあったら、\n              記録を直してから予約してください。\n            </p>\n            <label class=\"book-agree\">\n              <input type=\"checkbox\" id=\"book-agree\" />\n              この内容を相手に見せることに同意します\n            </label>\n          </section>\n\n          <!-- STEP 3 空き枠 -->\n          <section class=\"book-step\">\n            <h2 class=\"book-step-title\"><span>3</span>空いている時間を選ぶ</h2>\n            <p class=\"book-step-note\">15〜20分です。だいたいの時間でだいじょうぶ。</p>\n            <div class=\"book-slots\" id=\"book-slots\"></div>\n          </section>\n\n          <p class=\"book-rules\">\n            話したことは成績に関係しません。連絡先の交換はできない決まりです。\n            通話のリンクは、はじまる10分前にここに出ます。\n          </p>\n        </div>\n      </main>\n\n      <a class=\"help-fab\" href=\"#\" id=\"help-fab\">困ったときは</a>\n    </div>\n\n    \n    \n    \n    \n  ","script":"/**\n * 予約（C1・C2 生徒／S3 同意ゲート・S4 予約）\n * 生徒が「相手に何が渡るか」を同じ画面で確認してから確定する（docs/nanameya-privacy.md 3章）。\n */\nconst D = window.NANAMEYA_DATA;\nconst MASK = window.NANAMEYA_MASK;\nconst q = new URLSearchParams(location.search);\n\nconst volunteer = D.volunteers.find((v) => v.id === q.get('v')) || D.volunteers[0];\nconst consentOK = (q.get('consent') || D.consent.status) === 'approved';\nconst approach = D.approaches.find((a) => a.key === volunteer.approach);\n\n/* ---- 選んだ大人 ---- */\ndocument.querySelector('#book-person').innerHTML = `\n  <span class=\"person-avatar\" aria-hidden=\"true\">${volunteer.avatar}</span>\n  <div class=\"book-person-body\">\n    <b class=\"book-person-name\">${volunteer.name}</b>\n    <span class=\"person-title\">${volunteer.title}</span>\n    <span class=\"person-approach\">${approach ? approach.ico + ' ' + approach.label : ''}</span>\n    <p class=\"person-voice\">「${volunteer.voice}」</p>\n    <p class=\"person-intro\">${volunteer.intro}</p>\n  </div>`;\n\ndocument.querySelector('#consent-gate').hidden = consentOK;\ndocument.querySelector('#book-flow').hidden = !consentOK;\n\nif (consentOK) {\n  /* ---- 相手に渡るカードのプレビュー（探究カードと同じ組み立て）---- */\n  const nickInput = document.querySelector('#book-nick');\n  function renderPreview() {\n    const brief = MASK.buildBrief(D.entry, { type: 1, nickname: nickInput.value || '（未入力）' });\n    document.querySelector('#book-preview').innerHTML = `\n      <div class=\"book-preview-head\">\n        <b>${brief.grade}年生・${brief.nickname} さん</b>\n        <span>${brief.session}回の記録</span>\n      </div>\n      ${brief.blocks.map((b) => `\n        <div class=\"book-preview-block\">\n          <span class=\"book-preview-label\">${b.label}</span>\n          ${b.body.split('\\n').map((l) => `<p>${l}</p>`).join('')}\n        </div>`).join('')}`;\n  }\n  nickInput.addEventListener('input', renderPreview);\n  renderPreview();\n\n  /* ---- 空き枠。TimeRex 未登録のあいだはプレースホルダを出す ---- */\n  const timerex = (window.JOURNAL_CONFIG || {}).TIMEREX_URL;\n  const agree = document.querySelector('#book-agree');\n  const slotsEl = document.querySelector('#book-slots');\n\n  const fmt = (iso, min) => {\n    const d = new Date(iso);\n    const e = new Date(d.getTime() + min * 60000);\n    const t = (x) => `${x.getHours()}:${String(x.getMinutes()).padStart(2, '0')}`;\n    return `${d.getMonth() + 1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}） ${t(d)}〜${t(e)}`;\n  };\n\n  function renderSlots() {\n    if (timerex) {\n      slotsEl.innerHTML = `<iframe class=\"book-timerex\" src=\"${timerex}\" title=\"空き枠を選ぶ\"></iframe>`;\n      return;\n    }\n    const open = D.slots.filter((s) => !s.taken);\n    slotsEl.innerHTML = `\n      <p class=\"book-slots-note\">※ いまは見本です。TimeRex の予約カレンダーをここに埋め込みます。</p>\n      ${open.map((s) => `\n        <button type=\"button\" class=\"book-slot\" data-id=\"${s.id}\" ${agree.checked ? '' : 'disabled'}>\n          <b>${fmt(s.starts_at, s.duration_min)}</b>\n          <span>${s.duration_min}分</span>\n        </button>`).join('')}\n      ${agree.checked ? '' : '<p class=\"book-slots-lock\">2 の同意にチェックを入れると選べます</p>'}`;\n  }\n  agree.addEventListener('change', renderSlots);\n  renderSlots();\n\n  slotsEl.addEventListener('click', (e) => {\n    const btn = e.target.closest('.book-slot');\n    if (!btn) return;\n    alert('（モック）ここで予約が確定します。\\n確定すると TimeRex から Webhook が届き、'\n        + 'アプリ側の bookings に保存されます。\\n通話リンクは、はじまる10分前にジャーナルに出ます。');\n  });\n}\n\ndocument.querySelector('#help-fab').addEventListener('click', (e) => {\n  e.preventDefault(); alert('（モック）エスラボ運営にすぐ知らせます。');\n});\ndocument.querySelector('#consent-start').addEventListener('click', (e) => {\n  e.preventDefault(); alert('（モック）保護者向けの説明ページをひらきます。');\n});\n"},{"id":"sess-before","group":"生徒","label":"対話カード（当日まで）","note":"通話リンクは出さない。時間外の接続とリンクの流出を防ぐため。","page":"nanameya-session.html","q":"state=before","bodyClass":"naname-page","inner":"\n    <div class=\"app-shell\">\n      <header class=\"topbar\">\n        <a class=\"brand\" href=\"./nanameya.html\"><span class=\"brand-mark\">✦</span> ナナメの部屋</a>\n        <span class=\"topbar-role\">エスラボ</span>\n      </header>\n\n      <main class=\"naname-main\">\n        <p class=\"eyebrow\">NANAME NO HEYA</p>\n        <h1 class=\"naname-title\" id=\"sess-title\">予約している対話</h1>\n\n        <section class=\"sess-card\" id=\"sess-card\"></section>\n\n        <!-- 対話後：大人からの一言 → 次に挑戦することの下書き -->\n        <section class=\"sess-note\" id=\"sess-note\" hidden></section>\n\n        <p class=\"naname-foot-note\">\n          話したことは成績に関係しません。連絡先の交換はできない決まりです。\n          こまったら、右下のボタンをいつでも押してください。\n        </p>\n      </main>\n\n      <a class=\"help-fab is-strong\" href=\"#\" id=\"help-fab\">困ったときは</a>\n    </div>\n\n    \n    \n    \n  ","script":"/**\n * 生徒の対話カード（S5 対話・S6 つながる）\n * 通話リンクは開始10分前まで出さない（docs/nanameya-flow.md 決めごとA）。\n */\nconst D = window.NANAMEYA_DATA;\nconst q = new URLSearchParams(location.search);\n\nconst booking = D.bookings.find((b) => b.id === q.get('b')) || D.booking;\nconst volunteer = D.volunteers.find((v) => v.id === booking.volunteer_id);\nconst startsAt = new Date(booking.starts_at);\nconst endsAt = new Date(startsAt.getTime() + booking.duration_min * 60000);\n\nfunction currentState() {\n  const forced = q.get('state');\n  if (forced) return forced;\n  const now = Date.now();\n  if (now < startsAt.getTime() - 10 * 60000) return 'before';\n  if (now < startsAt.getTime()) return 'soon';\n  if (now < endsAt.getTime()) return 'live';\n  return 'after';\n}\nconst state = currentState();\n\nconst t = (d) => `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;\nconst day = `${startsAt.getMonth() + 1}月${startsAt.getDate()}日（${'日月火水木金土'[startsAt.getDay()]}）`;\n\nconst COPY = {\n  before: { badge: '予約ずみ', lead: 'その日になったら、ここに入り口が出ます。準備はいりません。',\n            note: '通話のリンクは、はじまる10分前に出ます。' },\n  soon:   { badge: 'まもなく', lead: 'そろそろです。静かなところで、ひとりで入ってください。',\n            note: 'カメラは出しても出さなくても大丈夫です。' },\n  live:   { badge: '対話中',   lead: 'いま話しています。', note: '' },\n  after:  { badge: 'おわり',   lead: 'おつかれさま。話したことは下に残しておきます。', note: '' }\n};\nconst c = COPY[state] || COPY.before;\ndocument.querySelector('#sess-title').textContent =\n  state === 'after' ? 'おわった対話' : state === 'live' ? '対話中' : '予約している対話';\nconst canEnter = state === 'soon' || state === 'live';\n\ndocument.querySelector('#sess-card').innerHTML = `\n  <div class=\"sess-head\">\n    <span class=\"brief-badge is-${state === 'after' ? 'done' : canEnter ? 'go' : 'wait'}\">${c.badge}</span>\n    <b class=\"brief-when\">${day} ${t(startsAt)}〜${t(endsAt)}</b>\n  </div>\n  <div class=\"sess-who\">\n    <span class=\"person-avatar\" aria-hidden=\"true\">${volunteer ? volunteer.avatar : '🙂'}</span>\n    <div>\n      <b>${volunteer ? volunteer.name : ''} さん</b>\n      <span class=\"person-title\">${volunteer ? volunteer.title : ''}</span>\n    </div>\n  </div>\n  <p class=\"sess-lead\">${c.lead}</p>\n  ${canEnter\n    ? `<a class=\"sess-enter\" href=\"${booking.meet_url}\" target=\"_blank\" rel=\"noopener\">はなしに行く <span aria-hidden=\"true\">→</span></a>`\n    : state === 'after' ? ''\n    : `<span class=\"sess-enter is-locked\">🔒 はじまる10分前に、ここに入り口が出ます</span>`}\n  ${c.note ? `<p class=\"sess-note-small\">${c.note}</p>` : ''}`;\n\n/* S6: 対話のあと、大人の一言が「次に挑戦すること」の下書きになる */\nif (state === 'after') {\n  const draft = booking.note_for_student\n    || '商店街のお店に「いつから続いているか」だけ聞いてみる。まず1軒。';\n  const el = document.querySelector('#sess-note');\n  el.hidden = false;\n  el.innerHTML = `\n    <h2 class=\"sess-note-title\">${volunteer ? volunteer.name : ''} さんからの一言</h2>\n    <blockquote class=\"sess-quote\" id=\"sess-draft\">${draft}</blockquote>\n    <p class=\"sess-note-desc\">\n      次にジャーナルを書くとき、「次に挑戦すること」にこれを写してみてください。\n      そのままでも、書きかえても、やめてもかまいません。\n    </p>\n    <button type=\"button\" class=\"sess-enter\" id=\"sess-copy\">この一言をコピーする</button>\n    <p class=\"sess-note-small\">\n      ナナメの部屋はエスラボ、ジャーナルは学校のもの。\n      ここで話したことが自動でジャーナルに入ることはありません。\n    </p>`;\n  document.querySelector('#sess-copy').addEventListener('click', async () => {\n    try { await navigator.clipboard.writeText(draft); } catch (_) { /* 失敗しても下に文は出ている */ }\n    document.querySelector('#sess-copy').textContent = 'コピーしました';\n  });\n}\n\ndocument.querySelector('#help-fab').addEventListener('click', (e) => {\n  e.preventDefault();\n  alert('（モック）エスラボ運営にすぐ知らせます。\\nいやな思いをしたときは、話している最中でも押して大丈夫です。');\n});\n"},{"id":"sess-soon","group":"生徒","label":"対話カード（10分前）","note":"ここで初めて入り口が出る。「困ったときは」は押しやすい塗りに。","page":"nanameya-session.html","q":"state=soon","bodyClass":"naname-page" ? `<p class=\"sess-note-small\">${c.note}</p>` : ''}`;\n\n/* S6: 対話のあと、大人の一言が「次に挑戦すること」の下書きになる */\nif (state === 'after') {\n  const draft = booking.note_for_student\n    || '商店街のお店に「いつから続いているか」だけ聞いてみる。まず1軒。';\n  const el = document.querySelector('#sess-note');\n  el.hidden = false;\n  el.innerHTML = `\n    <h2 class=\"sess-note-title\">${volunteer ? volunteer.name : ''} さんからの一言</h2>\n    <blockquote class=\"sess-quote\" id=\"sess-draft\">${draft}</blockquote>\n    <p class=\"sess-note-desc\">\n      次にジャーナルを書くとき、「次に挑戦すること」にこれを写してみてください。\n      そのままでも、書きかえても、やめてもかまいません。\n    </p>\n    <button type=\"button\" class=\"sess-enter\" id=\"sess-copy\">この一言をコピーする</button>\n    <p class=\"sess-note-small\">\n      ナナメの部屋はエスラボ、ジャーナルは学校のもの。\n      ここで話したことが自動でジャーナルに入ることはありません。\n    </p>`;\n  document.querySelector('#sess-copy').addEventListener('click', async () => {\n    try { await navigator.clipboard.writeText(draft); } catch (_) { /* 失敗しても下に文は出ている */ }\n    document.querySelector('#sess-copy').textContent = 'コピーしました';\n  });\n}\n\ndocument.querySelector('#help-fab').addEventListener('click', (e) => {\n  e.preventDefault();\n  alert('（モック）エスラボ運営にすぐ知らせます。\\nいやな思いをしたときは、話している最中でも押して大丈夫です。');\n});\n"},{"id":"volunteer","group":"ナナメの大人","label":"担当と空き枠","note":"未提出の議事録だけを「あなたの番」に。やることを常に少なく見せて燃え尽きを防ぐ。","page":"nanameya-volunteer.html","q":"","bodyClass":"naname-page","inner":"\n    <div class=\"app-shell\">\n      <header class=\"topbar\">\n        <a class=\"brand\" href=\"./portal.html\"><span class=\"brand-mark\">✦</span> ナナメの部屋</a>\n        <span class=\"topbar-role\" id=\"vol-role\">大人用</span>\n      </header>\n\n      <main class=\"naname-main\">\n        <p class=\"eyebrow\">VOLUNTEER</p>\n        <h1 class=\"naname-title\" id=\"vol-title\">担当と空き枠</h1>\n        <p class=\"naname-lead\">やることは2つだけ。空いている時間を出すことと、話したあとに一言残すこと。</p>\n\n        <section class=\"vol-state\" id=\"vol-state\"></section>\n\n        <section class=\"naname-section\" aria-labelledby=\"vol-todo-title\">\n          <h2 class=\"naname-section-title\" id=\"vol-todo-title\">あなたの番</h2>\n          <p class=\"naname-section-note\">議事録がまだのものを先に出しています。</p>\n          <div class=\"vol-list\" id=\"vol-todo\"></div>\n        </section>\n\n        <section class=\"naname-section\" aria-labelledby=\"vol-next-title\">\n          <h2 class=\"naname-section-title\" id=\"vol-next-title\">これからの対話</h2>\n          <div class=\"vol-list\" id=\"vol-next\"></div>\n        </section>\n\n        <section class=\"naname-section\" aria-labelledby=\"vol-slot-title\">\n          <h2 class=\"naname-section-title\" id=\"vol-slot-title\">空いている時間</h2>\n          <p class=\"naname-section-note\">\n            ここに出した時間だけが生徒に見えます。カレンダーで埋まっている時間には予約が入りません。\n          </p>\n          <div class=\"vol-slots\" id=\"vol-slots\"></div>\n        </section>\n\n        <section class=\"naname-section\" aria-labelledby=\"vol-done-title\">\n          <h2 class=\"naname-section-title\" id=\"vol-done-title\">おわった対話</h2>\n          <div class=\"vol-list\" id=\"vol-done\"></div>\n        </section>\n      </main>\n\n      <a class=\"help-fab\" href=\"#\" id=\"help-fab\">困ったときは</a>\n    </div>\n\n    \n    \n    \n  ","script":"/**\n * ナナメの大人（C6）の画面：空き枠の登録（V0-5/S1）と担当一覧・事後メモ（V1〜V3）\n * 未提出の議事録を一番上に出す（燃え尽きを防ぐため、やることは常に少なく見せる）。\n */\nconst D = window.NANAMEYA_DATA;\nconst me = D.me;\n\nconst t = (d) => `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;\nconst fmt = (iso, min) => {\n  const d = new Date(iso), e = new Date(new Date(iso).getTime() + min * 60000);\n  return `${d.getMonth() + 1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}） ${t(d)}〜${t(e)}`;\n};\n\n/* ---- 自分の状態（審査中は生徒の記録が一切見えない）---- */\nconst STATE = {\n  reviewing: { label: '審査中',       tone: 'wait', note: '事務局が確認しています。生徒の記録はまだ見られません。' },\n  training:  { label: '研修待ち',     tone: 'wait', note: '行動規範への署名と研修が終わると、空き枠を出せます。' },\n  trial:     { label: '慣らし運用中', tone: 'wait', note: 'はじめの数回は事務局が同席します。' },\n  active:    { label: '活動中',       tone: 'go',   note: 'カレンダーはつながっています。' },\n  paused:    { label: '一時停止中',   tone: 'done', note: '事務局が確認中です。新しい予約は入りません。' }\n};\nconst st = STATE[me.status] || STATE.reviewing;\ndocument.querySelector('#vol-state').innerHTML = `\n  <span class=\"brief-badge is-${st.tone}\">${st.label}</span>\n  <b class=\"vol-me\">${D.volunteerName(me.volunteer_id)} さん</b>\n  <span class=\"vol-state-note\">${st.note}</span>\n  <span class=\"vol-cal\">${me.calendar_connected ? '📅 Googleカレンダー連携ずみ' : '📅 カレンダー未接続'}</span>`;\n\n/* ---- 担当の予約 ---- */\nconst mine = D.bookings.filter((b) => b.volunteer_id === me.volunteer_id);\nconst todo = mine.filter((b) => b.status === 'ended');                       // 議事録が未提出\nconst next = mine.filter((b) => ['booked', 'reminded', 'live'].includes(b.status));\nconst done = mine.filter((b) => ['noted', 'closed', 'no_show', 'cancelled', 'reported'].includes(b.status));\n\nconst BADGE = { booked: '予約ずみ', reminded: 'まもなく', live: '対話中', ended: '議事録がまだ',\n                noted: '提出ずみ', closed: '完了', no_show: '来なかった', cancelled: 'キャンセル',\n                reported: '事務局が対応中' };\n\nfunction row(b, action) {\n  return `<article class=\"vol-item\">\n    <div class=\"vol-item-main\">\n      <b>${fmt(b.starts_at, b.duration_min)}</b>\n      <span class=\"vol-item-who\">${b.grade}年生・${b.nickname} さん</span>\n    </div>\n    <span class=\"vol-item-badge\">${BADGE[b.status] || b.status}</span>\n    ${action}\n  </article>`;\n}\n\nconst canSeeRecords = me.status === 'trial' || me.status === 'active';\nconst briefLink = (b) => canSeeRecords\n  ? `<a class=\"vol-item-btn\" href=\"./nanameya-brief.html?b=${b.id}\">探究カードを読む</a>`\n  : `<span class=\"vol-item-btn is-locked\">承認されると読めます</span>`;\n\ndocument.querySelector('#vol-todo').innerHTML = todo.length\n  ? todo.map((b) => row(b, `<a class=\"vol-item-btn is-primary\" href=\"./nanameya-note.html?b=${b.id}\">議事録を書く</a>`)).join('')\n  : '<p class=\"vol-empty\">いまやることはありません。</p>';\n\ndocument.querySelector('#vol-next').innerHTML = next.length\n  ? next.map((b) => row(b, briefLink(b))).join('')\n  : '<p class=\"vol-empty\">予約はまだ入っていません。</p>';\n\ndocument.querySelector('#vol-done').innerHTML = done.length\n  ? done.map((b) => row(b, '')).join('')\n  : '<p class=\"vol-empty\">まだありません。</p>';\n\n/* ---- 空き枠（TimeRex に委譲）---- */\nconst timerex = (window.JOURNAL_CONFIG || {}).TIMEREX_URL;\ndocument.querySelector('#vol-slots').innerHTML = `\n  ${D.slots.map((s) => `\n    <div class=\"vol-slot${s.taken ? ' is-taken' : ''}\">\n      <b>${fmt(s.starts_at, s.duration_min)}</b>\n      <span>${s.taken ? '予約が入りました' : '空いています'}</span>\n    </div>`).join('')}\n  <a class=\"vol-slot-add\" href=\"${timerex || '#'}\" ${timerex ? 'target=\"_blank\" rel=\"noopener\"' : ''}>\n    ＋ 空いている時間を追加する${timerex ? '' : '（TimeRex の登録後に有効になります）'}\n  </a>`;\n\ndocument.querySelector('#help-fab').addEventListener('click', (e) => {\n  e.preventDefault();\n  alert('（モック）事務局にすぐ知らせます。\\n生徒の様子が気になったときも、ここから。');\n});\n"},{"id":"brief","group":"ナナメの大人","label":"探究カード","note":"許可リストの4ブロックだけ。●● は自動で伏せた個人情報。本名・組・番号・先生コメントは渡らない。","page":"nanameya-brief.html","q":"state=before","bodyClass":"naname-page","inner":"\n    <div class=\"app-shell\">\n      <header class=\"topbar\">\n        <a class=\"brand\" href=\"./nanameya-volunteer.html\"><span class=\"brand-mark\">✦</span> ナナメの部屋</a>\n        <span class=\"topbar-role\">大人用</span>\n      </header>\n\n      <main class=\"naname-main\">\n        <p class=\"eyebrow\">BRIEF</p>\n        <h1 class=\"naname-title\">探究カード</h1>\n        <p class=\"naname-lead\">対話の前に、この子がいま何を追いかけているかだけ読んでおいてください。</p>\n\n        <!-- 対話の状態と入室 -->\n        <section class=\"brief-status\" id=\"brief-status\"></section>\n\n        <!-- 誰の記録か（学年＋ニックネームまで） -->\n        <section class=\"brief-who\" id=\"brief-who\"></section>\n\n        <!-- 探究の中身（許可リストの4ブロックのみ・自動マスク済み） -->\n        <section class=\"brief-blocks\" id=\"brief-blocks\"></section>\n\n        <!-- 期限切れ -->\n        <section class=\"brief-expired\" id=\"brief-expired\" hidden>\n          <span class=\"brief-expired-ico\">🔒</span>\n          <p>この記録を見られる期間（対話の終了から24時間）が過ぎました。<br />\n             続きが必要なときは事務局にご連絡ください。</p>\n        </section>\n\n        <section class=\"brief-rules\">\n          <b>お願い</b>\n          <ul>\n            <li>この内容は持ち出さないでください。コピー・保存・スクリーンショットはしないでください。</li>\n            <li>開いた記録は事務局に記録されます。</li>\n            <li>連絡先の交換はできません。</li>\n          </ul>\n          <p class=\"brief-rules-note\">\n            学校名・組・出席番号・本名・先生のコメントは、はじめから渡していません。\n            本文中の個人情報も自動で伏せていますが、完全ではありません。\n            気になる記述があれば「困ったときは」から事務局へ。\n          </p>\n        </section>\n      </main>\n\n      <a class=\"help-fab\" href=\"#\" id=\"help-fab\">困ったときは</a>\n    </div>\n\n    \n    \n    \n    \n  ","script":"/**\n * 探究カード（C6 大人が対話の前／最中に読む画面）\n * ルールの正本は docs/nanameya-privacy.md、流れは docs/nanameya-flow.md。\n *\n * 本番では /api/nanameya/brief?booking=... がサーバー側でマスク済みのカードを返す。\n * ここではモックデータに nanameya-mask.js をかけて、同じ形を作っている。\n */\nconst D = window.NANAMEYA_DATA;\nconst MASK = window.NANAMEYA_MASK;\nconst q = new URLSearchParams(location.search);\n\nconst booking = D.booking;\nconst volunteer = D.volunteers.find((v) => v.id === booking.volunteer_id);\nconst startsAt = new Date(booking.starts_at);\nconst endsAt = new Date(startsAt.getTime() + booking.duration_min * 60 * 1000);\n\n/* 状態：before（準備）/ soon（10分前〜）/ live（対話中）/ after（終了〜24h）/ expired\n   ?state= で上書きできる（画面確認用） */\nfunction currentState() {\n  const forced = q.get('state');\n  if (forced) return forced;\n  const now = Date.now();\n  if (now < startsAt.getTime() - 10 * 60 * 1000) return 'before';\n  if (now < startsAt.getTime()) return 'soon';\n  if (now < endsAt.getTime()) return 'live';\n  if (now < endsAt.getTime() + 24 * 60 * 60 * 1000) return 'after';\n  return 'expired';\n}\nconst state = currentState();\n\nconst fmtTime = (d) => `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;\nconst fmtDate = (d) => `${d.getMonth() + 1}月${d.getDate()}日`;\n\n/* ---- 対話の状態と入室ボタン ---- */\nconst STATUS = {\n  before:  { tone: 'wait', badge: '予約ずみ',   note: '入室リンクは開始の10分前に出ます。' },\n  soon:    { tone: 'go',   badge: 'まもなく',   note: '入室できます。' },\n  live:    { tone: 'go',   badge: '対話中',     note: '15〜20分を目安に。' },\n  after:   { tone: 'done', badge: '終了',       note: '議事録をお願いします（生徒向け1〜2行＋事務局向け）。' },\n  expired: { tone: 'done', badge: '終了',       note: '閲覧できる期間が過ぎました。' }\n};\n\nfunction renderStatus() {\n  const s = STATUS[state] || STATUS.before;\n  const canEnter = state === 'soon' || state === 'live';\n  document.querySelector('#brief-status').innerHTML = `\n    <div class=\"brief-status-main\">\n      <span class=\"brief-badge is-${s.tone}\">${s.badge}</span>\n      <b class=\"brief-when\">${fmtDate(startsAt)} ${fmtTime(startsAt)}〜${fmtTime(endsAt)}</b>\n      <span class=\"brief-with\">${volunteer ? volunteer.name + ' さん担当' : ''}</span>\n    </div>\n    <p class=\"brief-status-note\">${s.note}</p>\n    ${canEnter\n      ? `<a class=\"brief-enter\" href=\"${booking.meet_url}\" target=\"_blank\" rel=\"noopener\">通話に入る <span aria-hidden=\"true\">→</span></a>`\n      : state === 'after'\n        ? `<a class=\"brief-enter\" href=\"./nanameya-note.html?b=${booking.id}\">議事録を書く <span aria-hidden=\"true\">→</span></a>`\n        : `<span class=\"brief-enter is-locked\">開始10分前になると入れます</span>`}`;\n}\n\n/* ---- 誰の記録か（学年＋ニックネームまで）---- */\nfunction renderWho(brief) {\n  document.querySelector('#brief-who').innerHTML = `\n    <span class=\"brief-avatar\" aria-hidden=\"true\">🙂</span>\n    <div>\n      <b class=\"brief-nick\">${brief.grade}年生・${brief.nickname} さん</b>\n      <span class=\"brief-masked\">学校名／組／出席番号／本名は表示していません</span>\n    </div>\n    <span class=\"brief-src\">${brief.session}回の記録・${brief.updatedAt}</span>`;\n}\n\n/* ---- 探究の中身 ---- */\nfunction renderBlocks(brief) {\n  document.querySelector('#brief-blocks').innerHTML = brief.blocks.map((b) => `\n    <article class=\"brief-block\">\n      <h2 class=\"brief-block-label\">${b.label}</h2>\n      ${b.body.split('\\n').map((line) => `<p>${line}</p>`).join('')}\n    </article>`).join('');\n}\n\n/* ---- 描画 ---- */\nif (state === 'expired') {\n  document.querySelector('#brief-expired').hidden = false;\n  document.querySelector('#brief-who').hidden = true;\n  document.querySelector('#brief-blocks').hidden = true;\n  renderStatus();\n} else {\n  // ★ マスクはここではなく本番ではサーバー側。生データは大人に届けない。\n  const brief = MASK.buildBrief(D.entry, { type: 1, nickname: booking.nickname });\n  renderStatus();\n  renderWho(brief);\n  renderBlocks(brief);\n}\n\ndocument.querySelector('#help-fab').addEventListener('click', (e) => {\n  e.preventDefault();\n  alert('（モック）事務局にすぐ知らせます。\\n記録の中に気になる記述があった場合もここから。');\n});\n"},{"id":"brief-exp","group":"ナナメの大人","label":"探究カード（期限切れ）","note":"対話の終了から24時間で開けなくなる。","page":"nanameya-brief.html","q":"state=expired","bodyClass":"naname-page","inner":"\n    <div class=\"app-shell\">\n      <header class=\"topbar\">\n        <a class=\"brand\" href=\"./nanameya-volunteer.html\"><span class=\"brand-mark\">✦</span> ナナメの部屋</a>\n        <span class=\"topbar-role\">大人用</span>\n      </header>\n\n      <main class=\"naname-main\">\n        <p class=\"eyebrow\">BRIEF</p>\n        <h1 class=\"naname-title\">探究カード</h1>\n        <p class=\"naname-lead\">対話の前に、この子がいま何を追いかけているかだけ読んでおいてください。</p>\n\n        <!-- 対話の状態と入室 -->\n        <section class=\"brief-status\" id=\"brief-status\"></section>\n\n        <!-- 誰の記録か（学年＋ニックネームまで） -->\n        <section class=\"brief-who\" id=\"brief-who\"></section>\n\n        <!-- 探究の中身（許可リストの4ブロックのみ・自動マスク済み） -->\n        <section class=\"brief-blocks\" id=\"brief-blocks\"></section>\n\n        <!-- 期限切れ -->\n        <section class=\"brief-expired\" id=\"brief-expired\" hidden>\n          <span class=\"brief-expired-ico\">🔒</span>\n          <p>この記録を見られる期間（対話の終了から24時間）が過ぎました。<br />\n             続きが必要なときは事務局にご連絡ください。</p>\n        </section>\n\n        <section class=\"brief-rules\">\n          <b>お願い</b>\n          <ul>\n            <li>この内容は持ち出さないでください。コピー・保存・スクリーンショットはしないでください。</li>\n            <li>開いた記録は事務局に記録されます。</li>\n            <li>連絡先の交換はできません。</li>\n          </ul>\n          <p class=\"brief-rules-note\">\n            学校名・組・出席番号・本名・先生のコメントは、はじめから渡していません。\n            本文中の個人情報も自動で伏せていますが、完全ではありません。\n            気になる記述があれば「困ったときは」から事務局へ。\n          </p>\n        </section>\n      </main>\n\n      <a class=\"help-fab\" href=\"#\" id=\"help-fab\">困ったときは</a>\n    </div>\n\n    \n    \n    \n    \n  ","script":"/**\n * 探究カード（C6 大人が対話の前／最中に読む画面）\n * ルールの正本は docs/nanameya-privacy.md、流れは docs/nanameya-flow.md。\n *\n * 本番では /api/nanameya/brief?booking=... がサーバー側でマスク済みのカードを返す。\n * ここではモックデータに nanameya-mask.js をかけて、同じ形を作っている。\n */\nconst D = window.NANAMEYA_DATA;\nconst MASK = window.NANAMEYA_MASK;\nconst q = new URLSearchParams(location.search);\n\nconst booking = D.booking;\nconst volunteer = D.volunteers.find((v) => v.id === booking.volunteer_id);\nconst startsAt = new Date(booking.starts_at);\nconst endsAt = new Date(startsAt.getTime() + booking.duration_min * 60 * 1000);\n\n/* 状態：before（準備）/ soon（10分前〜）/ live（対話中）/ after（終了〜24h）/ expired\n   ?state= で上書きできる（画面確認用） */\nfunction currentState() {\n  const forced = q.get('state');\n  if (forced) return forced;\n  const now = Date.now();\n  if (now < startsAt.getTime() - 10 * 60 * 1000) return 'before';\n  if (now < startsAt.getTime()) return 'soon';\n  if (now < endsAt.getTime()) return 'live';\n  if (now < endsAt.getTime() + 24 * 60 * 60 * 1000) return 'after';\n  return 'expired';\n}\nconst state = currentState();\n\nconst fmtTime = (d) => `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;\nconst fmtDate = (d) => `${d.getMonth() + 1}月${d.getDate()}日`;\n\n/* ---- 対話の状態と入室ボタン ---- */\nconst STATUS = {\n  before:  { tone: 'wait', badge: '予約ずみ',   note: '入室リンクは開始の10分前に出ます。' },\n  soon:    { tone: 'go',   badge: 'まもなく',   note: '入室できます。' },\n  live:    { tone: 'go',   badge: '対話中',     note: '15〜20分を目安に。' },\n  after:   { tone: 'done', badge: '終了',       note: '議事録をお願いします（生徒向け1〜2行＋事務局向け）。' },\n  expired: { tone: 'done', badge: '終了',       note: '閲覧できる期間が過ぎました。' }\n};\n\nfunction renderStatus() {\n  const s = STATUS[state] || STATUS.before;\n  const canEnter = state === 'soon' || state === 'live';\n  document.querySelector('#brief-status').innerHTML = `\n    <div class=\"brief-status-main\">\n      <span class=\"brief-badge is-${s.tone}\">${s.badge}</span>\n      <b class=\"brief-when\">${fmtDate(startsAt)} ${fmtTime(startsAt)}〜${fmtTime(endsAt)}</b>\n      <span class=\"brief-with\">${volunteer ? volunteer.name + ' さん担当' : ''}</span>\n    </div>\n    <p class=\"brief-status-note\">${s.note}</p>\n    ${canEnter\n      ? `<a class=\"brief-enter\" href=\"${booking.meet_url}\" target=\"_blank\" rel=\"noopener\">通話に入る <span aria-hidden=\"true\">→</span></a>`\n      : state === 'after'\n        ? `<a class=\"brief-enter\" href=\"./nanameya-note.html?b=${booking.id}\">議事録を書く <span aria-hidden=\"true\">→</span></a>`\n        : `<span class=\"brief-enter is-locked\">開始10分前になると入れます</span>`}`;\n}\n\n/* ---- 誰の記録か（学年＋ニックネームまで）---- */\nfunction renderWho(brief) {\n  document.querySelector('#brief-who').innerHTML = `\n    <span class=\"brief-avatar\" aria-hidden=\"true\">🙂</span>\n    <div>\n      <b class=\"brief-nick\">${brief.grade}年生・${brief.nickname} さん</b>\n      <span class=\"brief-masked\">学校名／組／出席番号／本名は表示していません</span>\n    </div>\n    <span class=\"brief-src\">${brief.session}回の記録・${brief.updatedAt}</span>`;\n}\n\n/* ---- 探究の中身 ---- */\nfunction renderBlocks(brief) {\n  document.querySelector('#brief-blocks').innerHTML = brief.blocks.map((b) => `\n    <article class=\"brief-block\">\n      <h2 class=\"brief-block-label\">${b.label}</h2>\n      ${b.body.split('\\n').map((line) => `<p>${line}</p>`).join('')}\n    </article>`).join('');\n}\n\n/* ---- 描画 ---- */\nif (state === 'expired') {\n  document.querySelector('#brief-expired').hidden = false;\n  document.querySelector('#brief-who').hidden = true;\n  document.querySelector('#brief-blocks').hidden = true;\n  renderStatus();\n} else {\n  // ★ マスクはここではなく本番ではサーバー側。生データは大人に届けない。\n  const brief = MASK.buildBrief(D.entry, { type: 1, nickname: booking.nickname });\n  renderStatus();\n  renderWho(brief);\n  renderBlocks(brief);\n}\n\ndocument.querySelector('#help-fab').addEventListener('click', (e) => {\n  e.preventDefault();\n  alert('（モック）事務局にすぐ知らせます。\\n記録の中に気になる記述があった場合もここから。');\n});\n"},{"id":"note","group":"ナナメの大人","label":"議事録","note":"生徒向け1〜2行（120字）＋事務局向け。それぞれ誰が読むかを画面に書いてある。","page":"nanameya-note.html","q":"b=b2","bodyClass":"naname-page","inner":"\n    <div class=\"app-shell\">\n      <header class=\"topbar\">\n        <a class=\"brand\" href=\"./nanameya-volunteer.html\"><span class=\"brand-mark\">✦</span> ナナメの部屋</a>\n        <span class=\"topbar-role\">議事録</span>\n      </header>\n\n      <main class=\"naname-main\">\n        <p class=\"eyebrow\">MINUTES</p>\n        <h1 class=\"naname-title\">議事録</h1>\n        <p class=\"naname-lead\">2〜3分で終わります。長く書かないでください。</p>\n\n        <section class=\"note-meta\" id=\"note-meta\"></section>\n\n        <form id=\"note-form\">\n          <section class=\"note-block\">\n            <h2 class=\"note-label\">対話はできましたか</h2>\n            <div class=\"note-radios\">\n              <label><input type=\"radio\" name=\"held\" value=\"held\" checked /> 話せた</label>\n              <label><input type=\"radio\" name=\"held\" value=\"short\" /> 途中で終わった</label>\n              <label><input type=\"radio\" name=\"held\" value=\"no_show\" /> 生徒が来なかった</label>\n              <label><input type=\"radio\" name=\"held\" value=\"trouble\" /> つながらなかった</label>\n            </div>\n          </section>\n\n          <section class=\"note-block\">\n            <h2 class=\"note-label\">生徒に渡す一言 <em>必須・1〜2行</em></h2>\n            <p class=\"note-help\">\n              <b>次にやってみるといいこと</b>を1つだけ。感想や評価ではなく、明日できる具体を。\n              これがそのまま、生徒の次の記録の「次に挑戦すること」の下書きになります。\n            </p>\n            <textarea id=\"note-student\" maxlength=\"120\" rows=\"3\"\n              placeholder=\"商店街のお店に「いつから続いているか」だけ聞いてみる。まず1軒。\"></textarea>\n            <div class=\"note-count\"><span id=\"note-count\">0</span> / 120</div>\n            <p class=\"note-seen\">👀 生徒と事務局が読みます</p>\n          </section>\n\n          <section class=\"note-block\">\n            <h2 class=\"note-label\">事務局へ <em>任意</em></h2>\n            <p class=\"note-help\">気になったこと、次に会う人に伝えておきたいこと。無ければ空でかまいません。</p>\n            <textarea id=\"note-office\" rows=\"3\" placeholder=\"落ち着いて話せていた。特に気になることはなし。\"></textarea>\n            <p class=\"note-seen is-office\">🔒 事務局だけが読みます（生徒には見えません）</p>\n          </section>\n\n          <div class=\"note-actions\">\n            <button type=\"submit\" class=\"note-submit\">議事録を出す</button>\n            <span class=\"note-actions-note\">出すと、生徒の下書きに反映され、事務局に届きます。</span>\n          </div>\n        </form>\n      </main>\n\n      <a class=\"help-fab\" href=\"#\" id=\"help-fab\">困ったときは</a>\n    </div>\n\n    \n    \n    \n  ","script":"/**\n * 議事録（V2 / シナリオ1のステップ8）\n * 生徒向け（1〜2行・必須）と事務局向け（任意）の2パート。\n * 全文書き起こしはしない（docs/nanameya-flow.md 決めごとC）。\n */\nconst D = window.NANAMEYA_DATA;\nconst q = new URLSearchParams(location.search);\nconst booking = D.bookings.find((b) => b.id === q.get('b'))\n  || D.bookings.find((b) => b.status === 'ended') || D.booking;\n\nconst startsAt = new Date(booking.starts_at);\nconst t = (d) => `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;\nconst endsAt = new Date(startsAt.getTime() + booking.duration_min * 60000);\n\ndocument.querySelector('#note-meta').innerHTML = `\n  <b>${booking.grade}年生・${booking.nickname} さん</b>\n  <span>${startsAt.getMonth() + 1}月${startsAt.getDate()}日 ${t(startsAt)}〜${t(endsAt)}</span>\n  <a class=\"note-meta-link\" href=\"./nanameya-brief.html?b=${booking.id}\">探究カードを見返す</a>`;\n\nconst ta = document.querySelector('#note-student');\nconst count = document.querySelector('#note-count');\nta.addEventListener('input', () => { count.textContent = ta.value.length; });\n\ndocument.querySelector('#note-form').addEventListener('submit', (e) => {\n  e.preventDefault();\n  const held = document.querySelector('input[name=\"held\"]:checked').value;\n  const forStudent = ta.value.trim();\n  if (held === 'held' && !forStudent) {\n    alert('生徒に渡す一言を書いてください。1行でかまいません。');\n    ta.focus();\n    return;\n  }\n  alert('（モック）議事録を提出しました。\\n'\n      + '・生徒の「次に挑戦すること」に下書きとして入ります\\n'\n      + '・事務局の未確認一覧に届きます');\n});\n\ndocument.querySelector('#help-fab').addEventListener('click', (e) => {\n  e.preventDefault(); alert('（モック）事務局にすぐ知らせます。');\n});\n"},{"id":"admin","group":"事務局","label":"事務局","note":"止まっているものが上。未提出→未確認の順、通報は最上段。同意なしの予約は0が目標。","page":"nanameya-admin.html","q":"","bodyClass":"naname-page","inner":"\n    <div class=\"app-shell\">\n      <header class=\"topbar\">\n        <a class=\"brand\" href=\"./portal.html\"><span class=\"brand-mark\">✦</span> ナナメの部屋</a>\n        <span class=\"topbar-role\">事務局</span>\n      </header>\n\n      <main class=\"naname-main\">\n        <p class=\"eyebrow\">OFFICE</p>\n        <h1 class=\"naname-title\">事務局</h1>\n        <p class=\"naname-lead\">止まっているものが上に出ます。ここが詰まると安全確認が遅れます。</p>\n\n        <section class=\"adm-kpis\" id=\"adm-kpis\"></section>\n\n        <section class=\"naname-section\" aria-labelledby=\"adm-alert-title\">\n          <h2 class=\"naname-section-title\" id=\"adm-alert-title\">対応が要るもの</h2>\n          <div class=\"adm-list\" id=\"adm-alert\"></div>\n        </section>\n\n        <section class=\"naname-section\" aria-labelledby=\"adm-inbox-title\">\n          <h2 class=\"naname-section-title\" id=\"adm-inbox-title\">議事録の受信箱</h2>\n          <p class=\"naname-section-note\">未提出（大人がまだ書いていない）→ 未確認（事務局がまだ見ていない）の順。</p>\n          <div class=\"adm-list\" id=\"adm-inbox\"></div>\n        </section>\n\n        <section class=\"naname-section\" aria-labelledby=\"adm-all-title\">\n          <h2 class=\"naname-section-title\" id=\"adm-all-title\">予約の一覧</h2>\n          <div class=\"adm-table\" id=\"adm-all\"></div>\n        </section>\n      </main>\n    </div>\n\n    \n    \n    \n  ","script":"/**\n * 事務局（C4）の管理画面：E2 平常・E3 有事、そしてシナリオ1のステップ10。\n * ended（議事録が未提出）と noted（未確認）を最上位に出す。\n */\nconst D = window.NANAMEYA_DATA;\n\nconst t = (d) => `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;\nconst fmt = (iso) => {\n  const d = new Date(iso);\n  return `${d.getMonth() + 1}/${d.getDate()} ${t(d)}`;\n};\n\nconst B = D.bookings;\nconst unsubmitted = B.filter((b) => b.status === 'ended');     // 大人が書いていない\nconst unchecked   = B.filter((b) => b.status === 'noted');     // 事務局が見ていない\nconst reported    = B.filter((b) => b.status === 'reported');\nconst noShow      = B.filter((b) => b.status === 'no_show');\nconst noConsent   = 0; // 同意なしで発生した予約。0が目標（システムで止めているため）\n\n/* ---- KPI ---- */\ndocument.querySelector('#adm-kpis').innerHTML = [\n  { n: unsubmitted.length, label: '議事録が未提出', tone: unsubmitted.length ? 'warn' : 'ok' },\n  { n: unchecked.length,   label: '未確認の議事録', tone: unchecked.length ? 'warn' : 'ok' },\n  { n: reported.length,    label: '通報',           tone: reported.length ? 'alert' : 'ok' },\n  { n: noConsent,          label: '同意なしの予約', tone: noConsent ? 'alert' : 'ok' }\n].map((k) => `\n  <article class=\"adm-kpi is-${k.tone}\">\n    <strong>${k.n}</strong>\n    <span>${k.label}</span>\n  </article>`).join('');\n\n/* ---- 対応が要るもの（通報・無断キャンセル）---- */\nfunction alertRow(b, kind) {\n  const rep = D.reports.find((r) => r.booking_id === b.id);\n  return `<article class=\"adm-item is-${kind}\">\n    <div>\n      <b>${kind === 'reported' ? '🚨 通報' : '⚠️ 生徒が来なかった'}</b>\n      <span class=\"adm-item-sub\">${fmt(b.starts_at)}　${b.grade}年生・${b.nickname} さん　/　${D.volunteerName(b.volunteer_id)} さん</span>\n      ${rep ? `<p class=\"adm-item-body\">${fmt(rep.at)} に${rep.from === 'student' ? '生徒' : '大人'}が押しました。${rep.body}</p>` : ''}\n      ${b.note_for_office ? `<p class=\"adm-item-body\">${b.note_for_office}</p>` : ''}\n    </div>\n    <div class=\"adm-item-actions\">\n      ${kind === 'reported' ? '<button type=\"button\" class=\"adm-btn is-danger\">この大人の活動を止める</button>' : ''}\n      <button type=\"button\" class=\"adm-btn\">対応を記録する</button>\n    </div>\n  </article>`;\n}\nconst alerts = reported.map((b) => alertRow(b, 'reported')).concat(noShow.map((b) => alertRow(b, 'no_show')));\ndocument.querySelector('#adm-alert').innerHTML = alerts.length\n  ? alerts.join('') : '<p class=\"vol-empty\">いまは何もありません。</p>';\n\n/* ---- 議事録の受信箱 ---- */\nfunction inboxRow(b, kind) {\n  const late = Math.floor((Date.now() - new Date(b.starts_at).getTime()) / 3600000);\n  return `<article class=\"adm-item is-${kind}\">\n    <div>\n      <b>${kind === 'unsubmitted' ? '未提出' : '未確認'}</b>\n      <span class=\"adm-item-sub\">${fmt(b.starts_at)}（${late}時間前）　${b.grade}年生・${b.nickname} さん　/　${D.volunteerName(b.volunteer_id)} さん</span>\n      ${b.note_for_student ? `<p class=\"adm-item-body\"><span class=\"adm-tag\">生徒へ</span>${b.note_for_student}</p>` : ''}\n      ${b.note_for_office ? `<p class=\"adm-item-body\"><span class=\"adm-tag is-office\">事務局へ</span>${b.note_for_office}</p>` : ''}\n    </div>\n    <div class=\"adm-item-actions\">\n      ${kind === 'unsubmitted'\n        ? '<button type=\"button\" class=\"adm-btn\">催促する</button>'\n        : '<button type=\"button\" class=\"adm-btn is-primary\">確認してクローズ</button>'}\n    </div>\n  </article>`;\n}\ndocument.querySelector('#adm-inbox').innerHTML =\n  (unsubmitted.map((b) => inboxRow(b, 'unsubmitted'))\n    .concat(unchecked.map((b) => inboxRow(b, 'unchecked'))).join(''))\n  || '<p class=\"vol-empty\">たまっているものはありません。</p>';\n\n/* ---- 予約の一覧 ---- */\nconst LABEL = { booked: '予約ずみ', reminded: 'まもなく', live: '対話中', ended: '議事録が未提出',\n                noted: '未確認', closed: '完了', no_show: '来なかった', cancelled: 'キャンセル',\n                reported: '通報あり' };\ndocument.querySelector('#adm-all').innerHTML = `\n  <div class=\"adm-row is-head\"><span>日時</span><span>生徒</span><span>大人</span><span>状態</span></div>\n  ${B.slice().sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at)).map((b) => `\n    <div class=\"adm-row\">\n      <span>${fmt(b.starts_at)}</span>\n      <span>${b.grade}年生・${b.nickname}</span>\n      <span>${D.volunteerName(b.volunteer_id)}</span>\n      <span class=\"adm-status is-${b.status}\">${LABEL[b.status] || b.status}</span>\n    </div>`).join('')}`;\n\ndocument.querySelectorAll('.adm-btn').forEach((btn) => {\n  btn.addEventListener('click', () => alert('（モック）' + btn.textContent.trim() + ' を実行します。\\n実装時は対応した人と時刻を記録に残します。'));\n});\n"}];
