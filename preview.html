l{flex:1}.teacher-controls select{width:100%}.teacher-record{display:block}.student-float-nav{top:auto;bottom:18px}.student-float-nav span{display:none}.student-float-nav--previous{left:14px}.student-float-nav--next{right:14px}}\n.login-page{min-height:100vh;background:#fff;color:var(--ink);display:grid;place-items:center}.login-shell{width:min(100%,560px);min-height:100vh;padding:44px 24px 36px;display:flex;flex-direction:column;align-items:stretch}.login-brand{display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:800;letter-spacing:.04em}.login-card{margin:64px 0 0;padding:32px;border:1px solid var(--line);border-top:5px solid var(--green);border-radius:7px;background:#fff}.login-card h1{margin:6px 0 8px;font-size:26px;line-height:1.4}.login-lead{margin:0;color:var(--muted);font-size:15px;line-height:1.7}.login-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0 12px}.login-fields label{display:grid;grid-template-columns:1fr auto;gap:4px;align-items:end;color:var(--muted);font-size:13px;font-weight:700}.login-fields input{grid-column:1/-1;width:100%;height:54px;border:1px solid #bfcac0;border-radius:5px;padding:8px;text-align:center;font:700 22px \"Noto Sans JP\",sans-serif;color:var(--ink);outline-color:var(--green)}.login-message{min-height:20px;margin:0 0 8px;color:#ad4637;font-size:12px}.login-submit{display:grid;place-items:center;width:100%;min-height:50px;text-decoration:none;font-size:15px}.teacher-login{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;margin-top:48px;min-height:50px;border:1px solid var(--ink);border-radius:5px;background:var(--lime);color:var(--ink);font-size:15px;font-weight:700;text-decoration:none}.teacher-login span{color:var(--ink)}\n/* --- live同期版で追加した要素 --- */\n.load-status{margin:8px 0 16px;padding:10px 14px;border-radius:5px;background:#f3f7f2;border:1px solid #b9d9bf;color:var(--green-dark);font-size:13px}\n.empty-record{grid-column:1/-1;margin:8px 0;padding:20px;border:1px dashed #bfcac0;border-radius:6px;color:var(--muted);font-size:14px;text-align:center;background:#fbfbf8}\n.unfilled{color:#9aa39d;font-weight:400}\n.teacher-existing-comment h3 span{background:var(--coral)!important}\n.teacher-existing-comment p{background:#fff0e9;border-color:#f0b7a6}\n.teacher-key{height:30px;min-width:44px;border:1px solid #bfcac0;border-radius:4px;background:#fff;color:var(--ink);font:700 13px \"Noto Sans JP\",sans-serif;text-align:center;padding:0 6px}\n.number-picker .number-input{width:42px;height:100%;border:0;text-align:center;font:700 13px \"Noto Sans JP\",sans-serif;background:#fff;color:var(--ink);outline:none}\n\n/* ===== A4タテ 印刷（新レイアウト・生徒/先生 共通） 2026-09-01 ===== */\n@media print{\n  @page{size:A4 portrait;margin:12mm}\n  html,body{background:#fff!important}\n  .app-shell{max-width:none!important;width:100%!important;box-shadow:none!important;margin:0}\n  /* ヘッダーは「誰の・どの回か」だけ残して圧縮 */\n  .topbar,.teacher-topbar{height:auto!important;min-height:0!important;padding:0 0 4mm!important;margin:0 0 5mm!important;border-bottom:1.5px solid var(--ink)!important;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}\n  .brand{font-size:12pt!important}\n  #session-steps,.header-steps,.teacher-controls,.student-float-nav{display:none!important}\n  .student-identity{margin-left:auto!important;font-size:11pt!important;gap:10px!important}\n  .student-identity strong{border-left:1px solid #999;padding-left:8px}\n  /* 画面専用UI・案内は印刷しない */\n  .actions,#load-status,.intro-card,.teacher-comment-trigger,#open-comment,dialog,.empty-record{display:none!important}\n  /* セッション見出し */\n  .lesson-header{margin:0 0 5mm!important}\n  .lesson-header h2{font-size:16pt!important;line-height:1.35!important}\n  .eyebrow{font-size:9pt!important}\n  .journal-page{max-width:none!important;padding:0!important}\n  /* A4タテは1カラム（横並びは窮屈なので縦積み） */\n  .journal-page form,.teacher-record{display:block!important}\n  .form-section{margin:5mm 0 1mm!important;padding:0 0 0 3mm!important;border-left:3px solid var(--green)!important;background:transparent!important;break-after:avoid;page-break-after:avoid}\n  .section-label{font-size:11pt!important}\n  .section-note,.help{font-size:8.5pt!important;color:#555!important}\n  /* 設問＋回答は途中で改ページしない */\n  .question,.teacher-answer{break-inside:avoid;page-break-inside:avoid;padding:2.5mm 0!important;border-top:1px solid #ccc!important;margin:0!important}\n  .question legend,.teacher-answer h3{font-size:11pt!important;margin:0 0 1.5mm!important;font-weight:700}\n  .question legend span,.teacher-answer h3 span{background:#333!important;color:#fff!important;padding:1px 5px!important;font-size:8pt!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  .question em{display:none!important}   /* 「必須」バッジは紙では不要 */\n  /* 回答欄：中身を全部見せる（切らない） */\n  .question textarea,.short-answer,.teacher-answer p{\n    width:100%!important;box-sizing:border-box;border:1px solid #bbb!important;border-radius:3px!important;\n    padding:2mm!important;font-size:10.5pt!important;line-height:1.6!important;background:#fff!important;color:#000!important;\n    min-height:0!important;overflow:visible!important;resize:none!important;white-space:pre-wrap;word-break:break-word\n  }\n  .teacher-answer .unfilled{color:#999!important}\n  .teacher-existing-comment p{background:#fff!important;border-color:#e0b4a0!important}\n}\n\n/* =====================================================================\n   My 探究ジャーナル — デザイントークン & やさしさテーマ  (2026-09-01)\n   参考: team-mirai「みんなのRCV」のデザイン言語（ティール＋淡いtint面＋\n   やわらかいブラー影＋ゆったりした組版）を、中学生の探究に合わせて調整。\n   ★このファイルが色・型・余白・角丸・影の「決め事」の正本。\n     style.css / design-refresh.css の後に読み込み、既存の変数名を上書きする。\n   ===================================================================== */\n:root {\n  /* ---- Palette（ティール・オン白でのコントラストと子ども向け可読性で調整）---- */\n  --teal:        #30BCA7;   /* 主役アクセント・tint境界 */\n  --teal-hover:  #089781;\n  --teal-deep:   #0F8472;   /* 塗りボタン・白文字が乗る濃さ */\n  --teal-deepest:#0A5F52;   /* バッジ・押下 */\n  --teal-soft:   #64D8C6;\n  --teal-200:    #BCECD3;\n  --teal-100:    #E2F6F3;   /* 面（案内カード等） */\n  --teal-50:     #F0FBF9;   /* ごく淡い面 */\n\n  --amber:       #F6C445;   /* お祝い・ハイライト */\n  --amber-soft:  #FCEBB6;\n  --amber-ink:   #5A4500;\n  --coralc:      #F2795F;   /* コーラル（アクセント・境界・見出し） */\n  --coral-deep:  #E15A3C;   /* 白文字が乗る濃さ（選択中タブ・番号バッジ） */\n  --danger:      #E63946;\n\n  --ink:   #1F2937;         /* 本文 */\n  --muted: #5B6670;\n  --faint: #8A939C;\n  --paper: #FFFFFF;\n  --canvas:#F7FAF9;         /* ページ地＝ごく淡いミント白 */\n  --line:  #E7ECEA;         /* やわらかい境界 */\n\n  /* ---- 角丸 ---- */\n  --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --r-pill: 999px;\n\n  /* ---- 影（やわらかいブラーのみ。硬いオフセット影は使わない）---- */\n  --shadow-card: 0 8px 24px rgba(16, 55, 49, .08);\n  --shadow-elev: 0 12px 32px rgba(16, 55, 49, .12);\n\n  /* ---- 組版リズム（やさしさの主因）---- */\n  --lh-body: 1.8;\n  --track: 0.04em;\n\n  /* ---- 天地（縦）のスペーシング尺度（1つのルールに集約）----\n     xs=要素内 / sm=見出し内 / md=質問間 / lg=ブロック間 / xl=STEP群間 */\n  --v-xs: 6px;\n  --v-sm: 10px;\n  --v-md: 16px;\n  --v-lg: 24px;\n  --v-xl: 32px;\n\n  /* ---- 既存の変数名を新パレットへ再マッピング（全画面に波及）---- */\n  --green:      var(--teal-deep);\n  --green-dark: var(--teal-deepest);\n  --soft-green: var(--teal-100);\n  --sand:       var(--canvas);\n  --lime:       var(--amber);\n  --coral:      var(--coralc);\n  --blue:       var(--teal-100);\n}\n\n/* ─── Base：ゆったりした組版 ─────────────────────────────── */\nbody { background: var(--canvas); line-height: var(--lh-body); letter-spacing: var(--track); }\n\n/* ─── ヘッダー：黒2px罫線 → 1px soft ───────────────────── */\n.topbar { border-bottom: 1px solid var(--line); }\n.brand-mark { background: var(--teal); color: #08403790; color: #084037; }\n.header-steps li { border: 1px solid var(--teal-200); border-radius: var(--r-sm); color: var(--teal-deep); }\n.header-steps li.active { background: var(--teal-deep); border-color: var(--teal-deep); color: #fff; }\n.student-identity strong { border-left: 1px solid var(--line); }\n\n/* ─── 案内カード・見出し ───────────────────────────────── */\n.intro-card { background: var(--teal-100); border: 1px solid var(--teal-200); border-left: 5px solid var(--teal); border-radius: var(--r-md); }\n.spark { color: var(--teal-deep); }\n.eyebrow.coral { color: var(--coralc); }\n\n/* ─── 設問・入力：やわらかい枠＋ティールのfocus ───────── */\n.question { border-top-color: var(--line); }\n.question legend span { background: var(--teal-deep); border-radius: var(--r-sm); }\n.question em { background: #ffe9e2; color: #b5482f; }\n.question textarea, .short-answer { border: 1px solid #cfdad7; border-radius: var(--r-md); }\n.question textarea:focus, .short-answer:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(48, 188, 167, .22); }\n\n/* ─── ボタン：塗りティール＋やわらかい浮き ───────────── */\n.primary { background: var(--teal-deep); border: 1px solid var(--teal-deep); border-radius: var(--r-md); box-shadow: none; }\n.primary:hover { background: var(--teal-hover); transform: translateY(-1px); box-shadow: var(--shadow-card); }\n.secondary { background: #fff; border: 1px solid var(--line); border-radius: var(--r-md); }\n.secondary:hover { border-color: var(--teal-200); background: var(--teal-50); }\n\n/* ─── ダイアログ・引用 ─────────────────────────────────── */\n/* モーダルの縁はティール（ティールの存在感をここで出す） */\ndialog { border: 8px solid var(--teal); border-radius: var(--r-lg); box-shadow: var(--shadow-elev); }\ndialog .close{ color:var(--teal-deep); border-radius:var(--r-pill); transition:background .15s }\ndialog .close:hover{ background:var(--teal-50) }\nblockquote { background: var(--amber-soft); border-left: 5px solid var(--amber); border-radius: var(--r-sm); }\n.celebrate { color: var(--teal-deep); }\n\n/* ─── 先生ページ ───────────────────────────────────────── */\n.teacher-comment-trigger { border: 1px solid var(--teal); color: var(--teal-deep); border-radius: var(--r-md); }\n.teacher-comment-trigger:hover { background: var(--teal-50); }\n.teacher-answer h3 span { background: var(--teal-deep); }\n.teacher-answer p { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--teal-50); }\n.teacher-existing-comment h3 span { background: var(--coralc) !important; }\n.teacher-existing-comment p { background: #fff4ef; border-color: #f3c3b5; }\n.teacher-controls select, .teacher-key, .number-picker { border: 1px solid var(--line); border-radius: var(--r-sm); }\n.number-picker button { background: var(--teal-50); color: var(--teal-deep); }\n.empty-record { border: 1px dashed var(--teal-200); border-radius: var(--r-md); background: var(--teal-50); }\n\n/* ─── 状態表示 ─────────────────────────────────────────── */\n.load-status { background: var(--teal-100); border: 1px solid var(--teal-200); border-radius: var(--r-md); color: var(--teal-deep); }\n.comment-status { color: var(--teal-deep); }\n\n/* ─── ログイン ─────────────────────────────────────────── */\n.login-card { border: 1px solid var(--line); border-top: 5px solid var(--teal); border-radius: var(--r-lg); box-shadow: var(--shadow-card); }\n.login-fields input { border-radius: var(--r-md); }\n.login-fields input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(48, 188, 167, .22); }\n.login-submit { border-radius: var(--r-md); }\n.teacher-login { background: var(--amber); border: 1px solid var(--amber); border-radius: var(--r-md); color: var(--amber-ink); }\n.teacher-login span { color: var(--amber-ink); }\n\n/* ─── ログイン画面の調整（2026-09-01）─────────────────────\n   学年/組=セレクト、番号=入力。ボタンは小さく2つ統一。 */\n.login-fields select{\n  grid-column:1/-1;width:100%;height:52px;box-sizing:border-box;\n  border:1px solid #cfdad7;border-radius:var(--r-md);background:#fff;color:var(--ink);\n  padding:0 10px;text-align:center;text-align-last:center;\n  font:700 20px \"Noto Sans JP\",sans-serif;cursor:pointer;\n}\n.login-fields select:disabled{color:var(--faint);background:#f5f8f7;cursor:not-allowed}\n.login-fields select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(48,188,167,.22);outline:none}\n.login-fields input{height:52px}\n.login-fields input::placeholder{color:#cdd6d3}   /* サンプルは薄く */\n\n/* ボタン：小さく・センター揃え・2つ同じサイズに統一 */\n#student-login{text-align:center}\n.login-submit,.teacher-login{\n  width:230px;max-width:100%;align-self:center;\n  display:flex;margin-left:auto;margin-right:auto;\n  align-items:center;justify-content:center;gap:8px;\n  height:46px;min-height:46px;padding:0 22px;border-radius:var(--r-md);\n  font-size:14px;font-weight:700;\n}\n.login-submit{margin-top:4px}\n/* 先生導線：少し下げて、薄いミント色を入れる（控えめ・同サイズ） */\n.teacher-login{margin-top:30px;background:var(--teal-100);border:1px solid var(--teal-200);color:var(--teal-deep)}\n.teacher-login:hover{background:var(--teal-50);border-color:var(--teal)}\n.teacher-login span{color:var(--teal-deep)}\n\n/* ─── 生徒ページ：A〜Dタブ／番号バッジ をガイドラインに沿って（2026-09-01）─── */\n/* A〜D タブ：角丸の四角い箱ひとつ（入れ子なし）。ふだんは白＋ティール枠、選択中はコーラル塗り。\n   中身は <button>（生徒ページはJS生成）なので、li は素通しにして button/a を箱にする。 */\n.header-steps{gap:8px}\n.header-steps li{min-width:0;height:auto;padding:0;border:0;background:none}\n.header-steps li button,.header-steps li a{\n  display:grid;place-items:center;box-sizing:border-box;\n  min-width:40px;height:30px;padding:0 8px;\n  border:1px solid var(--teal-200);border-radius:var(--r-sm);\n  background:#fff;color:var(--teal-deep);\n  font:800 13px \"Noto Sans JP\",sans-serif;letter-spacing:0;\n  cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s}\n.header-steps li button:hover,.header-steps li a:hover{background:var(--teal-50)}\n.header-steps li.active button,.header-steps li.active a{background:var(--coral-deep);border-color:var(--coral-deep);color:#fff}\n\n/* 01〜09 番号バッジ：薄緑（ミント）の丸みピル＋濃い緑の数字 */\n.question legend span,.teacher-answer h3 span{\n  display:inline-grid;place-items:center;vertical-align:middle;\n  min-width:28px;height:23px;padding:0 8px;margin-right:2px;\n  background:var(--teal-100);color:var(--teal-deepest);border-radius:var(--r-pill);\n  font-size:11px;font-weight:800;letter-spacing:.02em;\n}\n/* SESSIONラベル（回と日付）はコーラル */\n#session-eyebrow,#teacher-session{color:var(--coral-deep)}\n/* 先生のコメントはコーラルで統一（生徒側の「先生からのコメント」導線・先生側の既存コメント） */\n.teacher-comment-trigger{border-color:var(--coralc);color:var(--coral-deep)}\n.teacher-comment-trigger:hover{background:#fff3ef}\n.teacher-existing-comment h3 span{background:var(--coral-deep)!important}\n.teacher-existing-comment p{background:#fff4ef;border-color:#f4c3b4}\n#teacher-feedback-dialog .eyebrow,#teacher-comment-dialog .eyebrow{color:var(--coral-deep)}\n\n/* ─── スペーシング／STEP見出し（2026-09-01）───────────────\n   STEP見出しとサブを1行に。各質問の横線は無くし、STEPの間に線を引く。 */\n/* ============ 縦（天地）リズム＝1つのルールに集約 ============\n   行間の基準はグリッドの row-gap（=v-md）。ブロック間=v-lg、STEP群間=v-xl。\n   STEP見出しはインラインで1行、上に区切り線。 */\n/* 画面はゆったり（やさしさ優先）。質問間=lg、STEP群=xl、ブロック=xl。印刷だけ別途詰める。 */\n.journal-page form{row-gap:var(--v-lg)}         /* 質問どうしの縦間隔（ゆったり） */\n.lesson-header{margin:0 0 var(--v-xl)}          /* タイトル ↔ カード */\n.intro-card{margin:0 0 var(--v-xl)}             /* カード ↔ 最初のSTEP */\n.form-section{display:block;margin:var(--v-md) 0 0;padding:var(--v-md) 0 0;border-left:0;border-top:1px solid var(--line)}\n.form-section .section-label{display:inline;margin:0;color:var(--teal-deep);font-weight:700}\n.form-section .section-note{display:inline;margin:0 0 0 12px;color:var(--muted)}\n.journal-page form>.form-section:first-child{margin-top:0}   /* 見出し↔STEP1にも線（row-gapで間隔確保） */\n.question{padding:0;margin:0;border-top:0}       /* 各質問の横線は不要。間隔は row-gap に一任 */\n.question legend{margin:0 0 var(--v-sm)}\n.help{margin:0 0 var(--v-sm)}\n.question textarea,.short-answer{margin-top:0}\n\n/* ─── A4タテ 1枚に寄せる：2カラム＋余白圧縮（無理な時は自然に次ページへ）─── */\n@media print{\n  @page{size:A4 portrait;margin:10mm}\n  .journal-page form{display:grid!important;grid-template-columns:1fr 1fr!important;column-gap:7mm!important;row-gap:0!important}\n  .journal-page form>.form-section{grid-column:1/-1!important}\n  .teacher-record{display:grid!important;grid-template-columns:1fr 1fr!important;column-gap:7mm!important}\n  .teacher-record .form-section{grid-column:1/-1!important}\n  .form-section{display:flex!important;flex-wrap:wrap!important;align-items:baseline!important;gap:8px!important;margin:3mm 0 1mm!important;padding:0!important;border-left:0!important}\n  .form-section .section-note{font-size:8pt!important}\n  .question,.teacher-answer{padding:1.6mm 0!important}\n  .question legend,.teacher-answer h3{font-size:10pt!important;margin:0 0 1mm!important}\n  .question textarea,.short-answer,.teacher-answer p{font-size:9.5pt!important;line-height:1.5!important;padding:1.5mm!important}\n  .lesson-header{margin:0 0 3mm!important}\n  .lesson-header h2{font-size:14pt!important}\n  .intro-card{display:none!important}\n}\n\n/* フッター：保存メッセージをボタンの近く（右側にまとめる） */\n.actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap;margin-top:var(--v-sm);border-top:1px solid var(--line);padding-top:var(--v-md)}\n.actions #save-status{margin:0;color:var(--muted);font-size:13px;order:0}\n\n/* 印刷：各質問の横線を消し、STEPの間にだけ線 */\n@media print{\n  .question,.teacher-answer{border-top:0!important}\n  .form-section{border-top:1px solid #d5dbd9!important;padding-top:2mm!important}\n  .journal-page form>.form-section:first-child{border-top:0!important;padding-top:0!important}\n}\n\n/* ─── 2カラムを整える（2026-09-01）───────────────────────\n   各STEPの余り問・短い回答欄(領域/場所)は全幅にして行を埋める。\n   2問並ぶ行は、セルを引き伸ばしテキストエリアを高さいっぱいに＝ボトムを揃える。 */\n.question.q-full{grid-column:1/-1}\n.journal-page form{align-items:stretch}\n.journal-page form .question{display:flex;flex-direction:column;min-width:0}\n.journal-page form .question>textarea{flex:1 1 auto}\n\n/* ─── みんなの今（ヘッダーボタン＋モーダル一覧）2026-09-01 ─── */\n.peers-btn{margin-left:6px;height:30px;padding:0 14px;white-space:nowrap;\n  border:1px solid var(--teal);border-radius:var(--r-pill);background:#fff;color:var(--teal-deep);\n  font:700 13px \"Noto Sans JP\",sans-serif;cursor:pointer;transition:background .15s}\n.peers-btn:hover{background:var(--teal-50)}\n#everyone-dialog{width:min(780px,calc(100vw - 40px));max-width:none;min-height:0;padding:32px}\n#everyone-dialog .eyebrow{color:var(--teal-deep)}\n.everyone-sub{margin:2px 0 0;color:var(--muted);font-size:13px}\n.peers-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;max-height:62vh;overflow:auto;padding-right:4px}\n.peers-note{grid-column:1/-1;margin:16px 0;color:var(--muted);text-align:center}\n.peer-card{border:1px solid var(--line);border-radius:var(--r-md);background:var(--teal-50);padding:12px 14px}\n.peer-card.is-me{background:#fff;border-color:var(--teal);box-shadow:0 0 0 2px rgba(48,188,167,.18)}\n.peer-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}\n.peer-no{display:inline-grid;place-items:center;min-width:26px;height:22px;border-radius:var(--r-pill);\n  background:var(--teal-deep);color:#fff;font-size:11px;font-weight:800}\n.peer-head b{font-size:14px;color:var(--ink)}\n.peer-theme{margin:0;font-size:13px;line-height:1.6;font-weight:700;color:var(--ink)}\n.peer-sub{margin:4px 0 0;font-size:12px;line-height:1.5;color:var(--muted);\n  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}\n@media(max-width:560px){.peers-grid{grid-template-columns:1fr}}\n\n/* みんなの今：カード内の設問行（01/04/09 を番号チップ＋値で） */\n.peer-item{display:flex;gap:6px;margin-top:6px;font-size:12px;line-height:1.55}\n.peer-item .peer-n{flex:0 0 auto;display:inline-grid;place-items:center;min-width:20px;height:18px;\n  border-radius:var(--r-pill);background:var(--teal-100);color:var(--teal-deepest);font-size:10px;font-weight:800}\n.peer-item .peer-v{color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}\n.peer-item .peer-v.empty{color:var(--faint)}\n\n/* ─── 先生メニュー（2026-09-01）─────────────────────────── */\n.teacher-menu-page{background:var(--canvas)}\n.topbar-role{margin-left:auto;color:var(--muted);font-size:13px;font-weight:700}\n.menu-main{max-width:900px;margin:0 auto;padding:48px 24px 64px}\n.menu-main .eyebrow{color:var(--teal-deep)}\n.menu-title{margin:6px 0 4px;font-size:28px}\n.menu-lead{margin:0 0 28px;color:var(--muted)}\n.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}\n.menu-tile{position:relative;display:flex;flex-direction:column;gap:4px;padding:24px 20px 22px;\n  border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;box-shadow:var(--shadow-card);\n  text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s,border-color .15s}\n.menu-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-elev);border-color:var(--teal-200)}\n.menu-ico{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:var(--r-md);\n  background:var(--teal-100);font-size:24px;margin-bottom:8px}\n.menu-name{font-size:17px}\n.menu-desc{color:var(--muted);font-size:13px;line-height:1.6}\n.menu-arrow{position:absolute;top:22px;right:20px;color:var(--teal-deep);font-weight:800}\n.coming-soon{display:grid;place-items:center;gap:14px;text-align:center;margin-top:8px;\n  padding:48px 20px;border:1px dashed var(--teal-200);border-radius:var(--r-lg);background:var(--teal-50);color:var(--muted);line-height:1.8}\n.coming-soon .menu-ico{width:64px;height:64px;font-size:32px}\n.back-btn{display:inline-block;margin-top:6px;padding:10px 18px;text-decoration:none;color:var(--teal-deep)}\n@media(max-width:720px){.menu-grid{grid-template-columns:1fr}}\n\n/* ─── 先生：コメント記入画面（2026-09-01）───────────────── */\n.teacher-page .topbar{height:auto;min-height:72px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px;gap:12px}\n/* ヘッダー右側：学年/組/番号 */\n.teacher-picker{display:flex;align-items:end;gap:10px;margin-left:auto}\n.teacher-picker label{display:grid;gap:3px;color:var(--muted);font-size:10px;font-weight:800}\n.teacher-picker select,.teacher-picker input{height:32px;border:1px solid var(--line);border-radius:var(--r-sm);\n  background:#fff;color:var(--ink);font:700 14px \"Noto Sans JP\",sans-serif;text-align:center;padding:0 6px;box-sizing:border-box}\n.teacher-picker select{min-width:54px;text-align-last:center;cursor:pointer}\n.teacher-picker .number-input{width:58px}\n.teacher-picker select:focus,.teacher-picker input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(48,188,167,.22);outline:none}\n\n/* コメント記入ボタン（コーラル塗り） */\n.comment-write-btn{align-self:flex-end;height:38px;padding:0 16px;white-space:nowrap;cursor:pointer;\n  border:1px solid var(--coral-deep);border-radius:var(--r-md);background:var(--coral-deep);color:#fff;\n  font:700 13px \"Noto Sans JP\",sans-serif;transition:background .15s}\n.comment-write-btn:hover{background:#cf4f34}\n\n/* コメントのモーダルはコーラル枠（8px）＋送付ボタンもコーラル */\n#teacher-comment-dialog{border-color:var(--coralc)}\n#teacher-comment-dialog .close{color:var(--coral-deep)}\n#teacher-comment-dialog .close:hover{background:#fff3ef}\n.comment-send{background:var(--coral-deep);border-color:var(--coral-deep)}\n.comment-send:hover{background:#cf4f34}\n\n/* 左右ナビ：枠なし・白・薄いブルーの矢印・サイズ2倍 */\n.teacher-page .student-float-nav{\n  width:77px;height:104px;border:0;background:#fff;border-radius:var(--r-lg);\n  color:#8fc9ea;font-size:52px;line-height:1;box-shadow:0 6px 20px rgba(16,55,49,.12);backdrop-filter:none}\n.teacher-page .student-float-nav:hover{color:#6fb7e0;background:#fff}\n.teacher-page .student-float-nav--previous{left:10px}\n.teacher-page .student-float-nav--next{right:10px}\n\n/* ─── 先生ヘッダー：学年/組=セグメントボタン、番号=横に。全部 高さ30で1行に揃える ─── */\n.teacher-picker{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}\n.teacher-picker .picker-label{color:var(--muted);font-size:11px;font-weight:800;line-height:30px}\n.seg{display:inline-flex;gap:4px}\n.teacher-picker .seg button,\n.teacher-picker .number-input{\n  height:30px;box-sizing:border-box;margin:0;vertical-align:middle;\n  border:1px solid var(--teal-200);border-radius:var(--r-sm);background:#fff;color:var(--teal-deep);\n  font:800 14px \"Noto Sans JP\",sans-serif;text-align:center;cursor:pointer;transition:background .15s,border-color .15s}\n.teacher-picker .seg button{min-width:30px;padding:0 8px;font-size:13px}\n.teacher-picker .seg button:hover{background:var(--teal-50)}\n.teacher-picker .seg button.active{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff}\n.teacher-picker .seg button[hidden]{display:none}\n.teacher-picker .number-input{width:52px;padding:0 6px;color:var(--ink);cursor:text}\n.teacher-picker .number-input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(48,188,167,.22);outline:none}\n\n/* 先生ヘッダー：メニューへ戻るボタン */\n.menu-back-btn{display:inline-flex;align-items:center;height:30px;padding:0 12px;white-space:nowrap;\n  border:1px solid var(--line);border-radius:var(--r-pill);background:#fff;color:var(--muted);\n  font:700 12px \"Noto Sans JP\",sans-serif;text-decoration:none;transition:background .15s,border-color .15s}\n.menu-back-btn:hover{background:var(--teal-50);border-color:var(--teal-200);color:var(--teal-deep)}\n/* みんなの今：先生はカードをクリックしてその生徒へ */\n.peer-card--btn{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;\n  transition:border-color .15s,box-shadow .15s,transform .12s}\n.peer-card--btn:hover{border-color:var(--teal);box-shadow:var(--shadow-card);transform:translateY(-1px)}\n\n/* ─── 先生ダッシュボード（2026-09-01・体裁）───────────────── */\n.dash-wrap{max-width:1100px;margin:0 auto;padding:28px 24px 64px}\n.dash-head .eyebrow{color:var(--teal-deep)}\n.dash-head #dash-title{margin:4px 0 0;font-size:26px}\n.dash-wrap .dash-card{margin-top:20px;padding:20px 22px;border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;box-shadow:var(--shadow-card)}\n.dash-h2{margin:0 0 14px;font-size:15px;color:var(--ink)}\n/* KPIタイル */\n.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}\n.kpi{padding:16px 18px;border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;box-shadow:var(--shadow-card)}\n.kpi-label{display:block;color:var(--muted);font-size:12px;font-weight:700}\n.kpi-val{display:block;margin-top:6px;font-size:30px;line-height:1;font-weight:800;color:var(--ink)}\n.kpi-val small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px}\n.kpi--teal{border-top:3px solid var(--teal)}\n.kpi--coral{border-top:3px solid var(--coralc)}\n.kpi--gray{border-top:3px solid var(--line)}\n/* 進捗バー */\n.bar{height:14px;border-radius:var(--r-pill);background:var(--teal-100);overflow:hidden}\n.bar-fill{height:100%;border-radius:inherit;background:var(--teal-deep);transition:width .4s ease}\n.bar-legend{margin-top:8px;color:var(--muted);font-size:13px}\n.bar-legend b{color:var(--ink);font-size:16px}\n/* 回ごと */\n.session-bars{display:grid;gap:12px}\n.sbar{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:12px}\n.sbar-name{display:grid;place-items:center;width:24px;height:24px;border-radius:var(--r-sm);background:var(--teal-50);color:var(--teal-deep);font-weight:800;font-size:12px}\n.sbar.is-active .sbar-name{background:var(--coral-deep);color:#fff}\n.sbar-num{color:var(--muted);font-size:12px;font-weight:700;min-width:40px;text-align:right}\n/* 生徒チップ */\n.roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}\n.rchip{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff}\n.rchip-no{display:inline-grid;place-items:center;min-width:26px;height:22px;border-radius:var(--r-pill);font-size:11px;font-weight:800;background:var(--teal-100);color:var(--teal-deepest)}\n.rchip-st{font-size:11px;font-weight:700;color:var(--muted)}\n.rchip--filled{background:var(--teal-50);border-color:var(--teal-200)}\n.rchip--filled .rchip-st{color:var(--teal-deep)}\n.rchip--commented{background:#fff4ef;border-color:#f3c3b5}\n.rchip--commented .rchip-no{background:var(--coral-deep);color:#fff}\n.rchip--commented .rchip-st{color:var(--coral-deep)}\n.rchip--empty{opacity:.7}\n@media(max-width:720px){.kpi-row{grid-template-columns:repeat(2,1fr)}}\n\n/* ─── 先生メニュー：Excelダウンロード（モック）2026-09-02 ─── */\n.menu-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px}\n.excel-btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;\n  border:1px solid #1a7f52;border-radius:var(--r-md);background:#1a7f52;color:#fff;\n  font:700 14px \"Noto Sans JP\",sans-serif;text-decoration:none;box-shadow:var(--shadow-card);\n  transition:background .15s,transform .12s}\n.excel-btn:hover{background:#166a45;transform:translateY(-1px)}\n.excel-ico{font-size:18px;line-height:1}\n.menu-actions-note{color:var(--faint);font-size:12px}\n\n/* ─── AIに相談（チャット）2026-09-02 ─────────────────────── */\n.ai-page .topbar .topbar-role{margin-left:12px}\n.ai-page .menu-back-btn{margin-left:auto}\n.ai-main{max-width:820px;margin:0 auto;padding:20px 16px 24px;display:flex;flex-direction:column;height:calc(100vh - 74px);box-sizing:border-box}\n.ai-chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:8px 4px 16px}\n.ai-msg{display:flex;gap:10px;align-items:flex-end;max-width:100%}\n.ai-msg--me{flex-direction:row-reverse}\n.ai-avatar{flex:0 0 auto;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--teal);color:#08403c;font-size:15px}\n.ai-bubble{max-width:76%;padding:12px 15px;border-radius:16px;line-height:1.75;font-size:14px;white-space:normal;word-break:break-word}\n.ai-msg--bot .ai-bubble{background:var(--teal-50);border:1px solid var(--teal-100);border-bottom-left-radius:5px;color:var(--ink)}\n.ai-msg--me .ai-bubble{background:var(--teal-deep);color:#fff;border-bottom-right-radius:5px}\n.ai-bubble.is-thinking{color:var(--muted);font-style:italic}\n.ai-form{display:flex;gap:10px;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px}\n.ai-form textarea{flex:1;resize:none;min-height:46px;max-height:160px;padding:12px 14px;border:1px solid #cfdad7;border-radius:var(--r-md);font:inherit;font-size:14px;line-height:1.6;background:#fff;color:var(--ink)}\n.ai-form textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(48,188,167,.22);outline:none}\n.ai-send{height:46px;min-width:80px;flex:0 0 auto}\n.ai-send:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}\n.ai-note{margin:8px 2px 0;color:var(--faint);font-size:12px}\n\n/* AIに相談：モデル選択＋回答のモデルタグ */\n.ai-model-pick{margin-left:12px;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;font-weight:800}\n.ai-model-pick select{height:30px;max-width:180px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--ink);font:600 12px \"Noto Sans JP\",sans-serif;padding:0 8px;cursor:pointer}\n.ai-model-pick select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(48,188,167,.22);outline:none}\n.ai-page .menu-back-btn{margin-left:12px}\n.ai-model-tag{display:block;margin-top:8px;color:var(--faint);font-size:10px;letter-spacing:.02em}\n@media(max-width:640px){.ai-model-pick{width:100%;order:5;margin-left:0}.ai-model-pick select{flex:1;max-width:none}}\n\n/* AIを使って分析：スコープ＋ヒント */\n.ai-scope{margin-left:12px}\n.ai-model-pick select:disabled{opacity:1;background:var(--teal-50);color:var(--teal-deep);cursor:default;font-weight:700}\n.ai-hint{display:block;margin-top:6px;color:var(--faint);font-size:11px}\n@media(max-width:820px){.ai-scope{order:6;width:100%;margin-left:0}}\n\n/* ─── エスラボ ポータル（2026-09-05）───────────────────────\n   サイトの入り口（/ = portal.html）。ジャーナルと同じトークンで組む。\n   ジャーナル側の「エスラボ ポータルへ戻る」テキストリンクもここ。 */\n.portal-page{background:var(--canvas);color:var(--ink)}\n.portal-shell{max-width:900px;margin:0 auto;padding:56px 24px 72px}\n.portal-brand{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;letter-spacing:var(--track)}\n.portal-head .eyebrow{margin:var(--v-xl) 0 0;color:var(--teal-deep)}\n.portal-title{margin:var(--v-xs) 0 var(--v-xs);font-size:28px;line-height:1.4}\n.portal-lead{margin:0;color:var(--muted);line-height:var(--lh-body)}\n.portal-section{margin-top:var(--v-xl)}\n.portal-section-title{margin:0 0 var(--v-md);font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.08em}\n.portal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}\n.portal-tile{position:relative;display:flex;flex-direction:column;gap:4px;padding:24px 20px 22px;\n  border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;box-shadow:var(--shadow-card);\n  text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s,border-color .15s}\na.portal-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-elev);border-color:var(--teal-200)}\n.portal-ico{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:var(--r-md);\n  background:var(--teal-100);font-size:24px;margin-bottom:8px}\n.portal-name{font-size:17px;line-height:1.5;padding-right:28px}\n.portal-desc{color:var(--muted);font-size:13px;line-height:1.6}\n.portal-arrow{position:absolute;top:22px;right:20px;color:var(--teal-deep);font-weight:800}\n.portal-tile.is-soon{background:var(--teal-50);border-style:dashed;border-color:var(--teal-200);box-shadow:none}\n.portal-tile.is-soon .portal-ico{background:#fff;filter:grayscale(1);opacity:.75}\n.portal-tile.is-soon .portal-name{color:var(--muted)}\n.portal-badge{position:absolute;top:20px;right:18px;padding:4px 10px;border-radius:var(--r-pill);\n  background:#fff;border:1px solid var(--teal-200);color:var(--teal-deep);font-size:11px;font-weight:700}\n.portal-foot{margin-top:var(--v-xl);padding-top:var(--v-md);border-top:1px solid var(--line);\n  color:var(--faint);font-size:12px;letter-spacing:var(--track)}\n@media(max-width:720px){.portal-shell{padding:36px 20px 56px}.portal-grid{grid-template-columns:1fr}}\n\n/* ジャーナル → ポータルへ戻るテキストリンク */\n.portal-back{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;\n  color:var(--teal-deep);font-size:13px;font-weight:700;text-decoration:none;letter-spacing:var(--track)}\n.portal-back:hover{text-decoration:underline}\n.login-shell .portal-back{margin-bottom:var(--v-lg)}\n\n/* ─── ナナメの部屋（2026-09-05）─────────────────────────────\n   docs/nanameya.md のシナリオ S2（選ぶ）/ S3（同意ゲート）/ S5（通報導線）。\n   評価しない場所なので、ティールは使うが「採点」を思わせる強い色面は置かない。 */\n.naname-page{background:var(--canvas)}\n.naname-main{max-width:900px;margin:0 auto;padding:48px 24px 96px}\n.naname-main .eyebrow{color:var(--teal-deep)}\n.naname-title{margin:var(--v-xs) 0 var(--v-sm);font-size:28px;line-height:1.45}\n.naname-lead{margin:0;color:var(--muted);line-height:var(--lh-body)}\n.naname-section{margin-top:var(--v-xl)}\n.naname-section-title{margin:0 0 var(--v-xs);font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.08em}\n.naname-section-note{margin:0 0 var(--v-md);color:var(--faint);font-size:12px;line-height:1.7}\n.naname-foot-note{margin-top:var(--v-xl);padding-top:var(--v-md);border-top:1px solid var(--line);\n  color:var(--faint);font-size:12px;line-height:1.8}\n\n/* S3: 保護者同意ゲート */\n.consent-gate[hidden]{display:none}\n.consent-gate{display:flex;gap:16px;align-items:flex-start;margin-top:var(--v-xl);padding:22px 22px 20px;\n  border:1px solid var(--amber);border-radius:var(--r-lg);background:#FFFBEF}\n.consent-ico{display:inline-grid;place-items:center;flex:0 0 auto;width:44px;height:44px;\n  border-radius:var(--r-md);background:#fff;font-size:22px}\n.consent-name{display:block;font-size:16px}\n.consent-desc{margin:var(--v-xs) 0 var(--v-sm);color:var(--muted);font-size:13px;line-height:1.8}\n.consent-btn{display:inline-block;padding:10px 16px;border-radius:var(--r-md);text-decoration:none;\n  background:#fff;border:1px solid var(--amber);color:var(--amber-ink);font-size:13px;font-weight:700}\n.consent-btn:hover{background:var(--amber-soft)}\n\n/* S2: 迫り方チップ */\n.approach-row{display:flex;flex-wrap:wrap;gap:8px}\n.approach-chip{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;curs },\n      { key: 'unknown',label: 'まだわからないこと・次の一歩', cols: [10, 13] }\n    ]\n  };\n\n  const REDACT = '●●●';\n\n  /** 自由記述から個人情報を伏せる。name は生徒の実名（姓名を分解して消す）。 */\n  function maskText(text, name) {\n    if (!text) return '';\n    let out = String(text);\n\n    // 1) 生徒本人の氏名（姓・名それぞれ）。2文字以上のときだけ消す（誤爆防止）\n    (name || '').split(/[\\s　]+/).filter((p) => p.length >= 2)\n      .forEach((part) => { out = out.split(part).join('●●'); });\n\n    // 2) パターンで消せるもの\n    out = out\n      .replace(/https?:\\/\\/\\S+/g, REDACT)                                   // URL\n      .replace(/[\\w.+-]+@[\\w-]+\\.[\\w.-]+/g, REDACT)                         // メール\n      .replace(/@[A-Za-z0-9_]{2,}/g, REDACT)                                // SNSのID\n      .replace(/0\\d{1,4}-?\\d{1,4}-?\\d{3,4}/g, REDACT)                       // 電話番号\n      .replace(/\\d+丁目[\\d-]*/g, REDACT)                                    // 住所\n      .replace(/[\\u4E00-\\u9FFF\\u3040-\\u309F\\u30A0-\\u30FF]{1,10}(小学校|中学校|高等学校|高校)/g, '●●学校');\n\n    return out;\n  }\n\n  /**\n   * 生徒1件分のエントリから、大人に見せるカードを組み立てる。\n   * 戻り値には name / cls / no / teacher_comment を**含めない**。\n   */\n  function buildBrief(entry, opts) {\n    const o = opts || {};\n    const type = o.type || 1;\n    const blocks = (FIELDS[type] || FIELDS[1]).map((f) => ({\n      key: f.key,\n      label: f.label,\n      body: f.cols\n        .map((c) => maskText(entry['col' + c], entry.name))\n        .filter((t) => t && t.trim())\n        .join('\\n')\n    })).filter((b) => b.body);\n\n    return {\n      grade: entry.grade,          // 学年だけ渡す\n      nickname: o.nickname || '',  // 生徒が予約時に決める表示名\n      session: entry.session,\n      sessionLabel: o.sessionLabel || '',\n      updatedAt: entry.updated_at || '',\n      blocks\n      // cls / no / name / teacher_comment は意図的に含めない\n    };\n  }\n\n  return { FIELDS, maskText, buildBrief };\n})();\n";

      document.body.appendChild(d); return d;

  };
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href');
    if (!href || /^(#|https?:)/.test(href)) return;
    e.preventDefault();

`;
