<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIを使って分析 | My 探究ジャーナル</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./design-refresh.css" />
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body class="teacher-page ai-page">
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./teacher.html"><span class="brand-mark">✦</span> My 探究ジャーナル</a>
        <span class="topbar-role">AIを使って分析</span>
        <div class="teacher-picker ai-scope">
          <span class="picker-label">学年</span>
          <div class="seg" id="grade-seg" role="group" aria-label="学年">
            <button type="button" data-grade="1" class="active">1</button>
            <button type="button" data-grade="2">2</button>
            <button type="button" data-grade="3">3</button>
          </div>
          <span class="picker-label">組</span>
          <div class="seg" id="class-seg" role="group" aria-label="組">
            <button type="button" data-cls="A" class="active">A</button>
            <button type="button" data-cls="B">B</button>
            <button type="button" data-cls="C">C</button>
            <button type="button" data-cls="D">D</button>
          </div>
        </div>
        <label class="ai-model-pick">モデル
          <select id="ai-model" disabled title="このAIは gpt-5.6-luna 固定です">
            <option value="gpt-5.6-luna" selected>gpt-5.6-luna</option>
          </select>
        </label>
        <a class="menu-back-btn" href="./teacher.html">☰ メニュー</a>
      </header>

      <main class="ai-main">
        <div class="ai-chat" id="ai-chat"></div>
        <form class="ai-form" id="ai-form">
          <textarea id="ai-input" rows="1" placeholder="このクラスの記録について質問（Enterで送信 / Shift+Enterで改行）"></textarea>
          <button type="submit" class="primary ai-send" id="ai-send">送信</button>
        </form>
        <p class="ai-note">回答は「探究記録データ」だけを根拠にします（外部情報は使いません）。最終判断は先生が行ってください。モデル: gpt-5.6-luna（固定）</p>
      </main>
    </div>

    <script src="./teacher-ai.js"></script>
  </body>
</html>
