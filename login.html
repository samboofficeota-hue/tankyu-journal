<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My 探究ジャーナル</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" /><link rel="stylesheet" href="./design-refresh.css" />
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <div class="login-brand"><span class="brand-mark">✦</span><span>My 探究ジャーナル</span></div>
      <section class="login-card" aria-labelledby="login-title">
        <p class="eyebrow">STUDENT LOGIN</p>
        <h1 id="login-title">自分のジャーナルをひらく</h1>
        <p class="login-lead">学年・組・番号を入力してください。</p>
        <form id="student-login">
          <div class="login-fields">
            <label>学年<input id="grade" inputmode="numeric" maxlength="1" placeholder="9" required /><span>年</span></label>
            <label>組<input id="class" maxlength="1" placeholder="A" required /><span>組</span></label>
            <label>番号<input id="number" inputmode="numeric" maxlength="2" placeholder="47" required /><span>番</span></label>
          </div>
          <p class="login-message" id="login-message" aria-live="polite"></p>
          <button class="primary login-submit" type="submit">ジャーナルをひらく</button>
        </form>
      </section>
      <a class="teacher-login" href="./teacher.html">先生用ログイン <span>→</span></a>
    </main>
    <script src="./config.js"></script>
    <script src="./schema.js"></script>
    <script src="./api.js"></script>
    <script src="./login.js"></script>
  </body>
</html>
