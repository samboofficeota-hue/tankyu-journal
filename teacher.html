<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>先生用 | My 探究ジャーナル</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./design-refresh.css" />
  </head>
  <body class="teacher-page">
    <div class="app-shell">
      <header class="topbar teacher-topbar">
        <a class="brand" href="./login.html"><span class="brand-mark">✦</span> My 探究ジャーナル</a>
        <div class="teacher-controls" aria-label="表示する生徒を選ぶ">
          <label>授業
            <select id="lesson-select"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
          </label>
          <label>学年<input id="grade-input" class="teacher-key" inputmode="numeric" value="9" maxlength="2" /></label>
          <label>組<input id="class-input" class="teacher-key" value="A" maxlength="2" /></label>
          <label>番号
            <span class="number-picker">
              <button type="button" id="previous-student" aria-label="前の番号">‹</button>
              <input id="number-input" class="teacher-key number-input" inputmode="numeric" value="47" maxlength="3" />
              <button type="button" id="next-student" aria-label="次の番号">›</button>
            </span>
          </label>
          <button type="button" class="primary" id="load-student">表示</button>
        </div>
      </header>
      <main>
        <section class="view active">
          <div class="student-layout">
            <section class="journal-page teacher-journal-page">
              <div class="lesson-header">
                <div>
                  <p class="eyebrow" id="teacher-session">SESSION A</p>
                  <h2 id="teacher-title"></h2>
                </div>
                <button type="button" class="teacher-comment-trigger" id="open-comment">先生コメントを書く</button>
              </div>
              <div class="intro-card"><span class="spark">✦</span><p id="student-summary">学年・組・番号を選んで「表示」を押してください。</p></div>
              <p id="teacher-load-status" class="load-status" aria-live="polite" hidden></p>
              <div class="teacher-record" id="teacher-record"></div>
            </section>
          </div>
        </section>
      </main>
    </div>
    <dialog id="teacher-comment-dialog">
      <button class="close" aria-label="閉じる">×</button>
      <p class="eyebrow coral">TEACHER COMMENT</p>
      <h2>先生コメント</h2>
      <p class="comment-target" id="comment-target"></p>
      <textarea id="teacher-comment" placeholder="気づいたことや、次に考えてほしい問いを届けよう"></textarea>
      <div class="comment-actions">
        <button type="button" class="secondary" id="save-comment-draft">下書き保存</button>
        <button type="button" class="primary" id="send-comment">これで送付</button>
      </div>
      <p class="comment-status" id="comment-status" aria-live="polite"></p>
    </dialog>
    <script src="./config.js"></script>
    <script src="./schema.js"></script>
    <script src="./api.js"></script>
    <script src="./teacher.js"></script>
  </body>
</html>
