<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>コメント記入 | My 探究ジャーナル</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./design-refresh.css" />
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body class="teacher-page">
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./teacher.html"><span class="brand-mark">✦</span> My 探究ジャーナル</a>
        <ol class="header-steps" id="session-steps" aria-label="探究の回">
          <li class="active"><button type="button" data-session="A" aria-current="page">A</button></li>
          <li><button type="button" data-session="B">B</button></li>
          <li><button type="button" data-session="C">C</button></li>
          <li><button type="button" data-session="D">D</button></li>
        </ol>
        <div class="teacher-picker">
          <span class="picker-label">学年</span>
          <div class="seg" id="grade-seg" role="group" aria-label="学年">
            <button type="button" data-grade="1" class="active">1</button>
            <button type="button" data-grade="2">2</button>
            <button type="button" data-grade="3">3</button>
          </div>
          <span class="picker-label">組</span>
          <div class="seg" id="class-seg" role="group" aria-label="組">
            <button type="button" data-cls="A" class="active">A</button>
            <button type="button" data-cls="B">B</button>
            <button type="button" data-cls="C">C</button>
            <button type="button" data-cls="D">D</button>
          </div>
          <span class="picker-label">番号</span>
          <input id="number-input" class="number-input" inputmode="numeric" maxlength="3" value="1" aria-label="番号" />
        </div>
      </header>

      <main>
        <section class="view active">
          <div class="student-layout">
            <section class="journal-page teacher-journal-page">
              <div class="lesson-header">
                <div>
                  <p class="eyebrow" id="teacher-session">SESSION A</p>
                  <h2 id="teacher-title"></h2>
                </div>
                <button type="button" class="comment-write-btn" id="open-comment">コメントを記入する</button>
              </div>
              <div class="intro-card"><span class="spark">✦</span><p id="student-summary">学年・組・番号を選ぶと記録が表示されます。</p></div>
              <p id="teacher-load-status" class="load-status" aria-live="polite" hidden></p>
              <div class="teacher-record" id="teacher-record"></div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <!-- サイドの半透明ナビ（前/次の生徒・スワイプでも移動） -->
    <button class="student-float-nav student-float-nav--previous" id="float-previous" aria-label="前の生徒">‹<span>前の生徒</span></button>
    <button class="student-float-nav student-float-nav--next" id="float-next" aria-label="次の生徒"><span>次の生徒</span>›</button>

    <dialog id="teacher-comment-dialog">
      <button class="close" aria-label="閉じる">×</button>
      <p class="eyebrow coral">TEACHER'S COMMENT</p>
      <h2>コメントを記入する</h2>
      <p class="comment-target" id="comment-target"></p>
      <textarea id="teacher-comment" placeholder="気づいたことや、次に考えてほしい問いを届けよう"></textarea>
      <div class="comment-actions">
        <button type="button" class="secondary" id="save-comment-draft">下書き保存</button>
        <button type="button" class="primary comment-send" id="send-comment">これで送付</button>
      </div>
      <p class="comment-status" id="comment-status" aria-live="polite"></p>
    </dialog>

    <script src="./config.js"></script>
    <script src="./schema.js"></script>
    <script src="./api.js"></script>
    <script src="./teacher.js"></script>
  </body>
</html>
