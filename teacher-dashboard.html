<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ダッシュボード | My 探究ジャーナル</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./design-refresh.css" />
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body class="teacher-page dashboard-page">
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./teacher.html"><span class="brand-mark">✦</span> My 探究ジャーナル</a>
        <ol class="header-steps" id="session-steps" aria-label="探究の回">
          <li class="active"><button type="button" data-session="A" aria-current="page">A</button></li>
          <li><button type="button" data-session="B">B</button></li>
          <li><button type="button" data-session="C">C</button></li>
          <li><button type="button" data-session="D">D</button></li>
        </ol>
        <div class="teacher-picker">
          <span class="picker-label">学年</span>
          <div class="seg" id="grade-seg" role="group" aria-label="学年">
            <button type="button" data-grade="1" class="active">1</button>
            <button type="button" data-grade="2">2</button>
            <button type="button" data-grade="3">3</button>
          </div>
          <span class="picker-label">組</span>
          <div class="seg" id="class-seg" role="group" aria-label="組">
            <button type="button" data-cls="A" class="active">A</button>
            <button type="button" data-cls="B">B</button>
            <button type="button" data-cls="C">C</button>
            <button type="button" data-cls="D">D</button>
          </div>
        </div>
        <a class="menu-back-btn" href="./teacher.html">☰ メニュー</a>
      </header>

      <main>
        <div class="dash-wrap">
          <div class="dash-head">
            <p class="eyebrow" id="dash-eyebrow">DASHBOARD</p>
            <h1 id="dash-title">クラスの状況</h1>
          </div>
          <p id="dash-status" class="load-status" aria-live="polite" hidden></p>

          <div class="kpi-row" id="kpi-row"></div>

          <section class="dash-card">
            <h2 class="dash-h2">記入の進み（この回）</h2>
            <div class="progress" id="progress"></div>
          </section>

          <section class="dash-card">
            <h2 class="dash-h2">回ごとの記入状況</h2>
            <div class="session-bars" id="session-bars"></div>
          </section>

          <section class="dash-card">
            <h2 class="dash-h2">生徒の状況（この回）</h2>
            <div class="roster-grid" id="roster-grid"></div>
          </section>
        </div>
      </main>
    </div>

    <script src="./config.js"></script>
    <script src="./schema.js"></script>
    <script src="./api.js"></script>
    <script src="./dashboard.js"></script>
  </body>
</html>
