# Cloudflare Pages + D1 設定
# ローカル: wrangler pages dev .   （.wrangler/state 下に自動でローカルD1が作られる）
# 本番: `wrangler d1 create tankyu-journal` で得た database_id を下に貼る
name = "tankyu-journal"
pages_build_output_dir = "."
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "tankyu-journal"
database_id = "3e20a23c-de5d-4338-97a8-965ad878fdb7"   # 本番D1
